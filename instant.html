<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ROASTERS — WORKS EVERYWHERE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, sans-serif;
            background: #000; 
            color: white; 
            overflow: hidden;
            touch-action: none;
        }
        
        #game {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a0a15 0%, #151525 100%);
        }
        
        /* Player */
        #player {
            position: absolute;
            width: 40px;
            height: 60px;
            background: linear-gradient(180deg, #ff4444, #aa0000);
            border-radius: 20px 20px 10px 10px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            transition: transform 0.05s;
            z-index: 10;
        }
        
        #player::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background: #ffddcc;
            border-radius: 50%;
        }
        
        #player::after {
            content: '👊';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }
        
        .player-eyes {
            position: absolute;
            top: 12px;
            display: flex;
            gap: 6px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .player-eye {
            width: 5px;
            height: 5px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 5px #ff0000;
        }
        
        /* Enemies */
        .enemy {
            position: absolute;
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #8800ff, #aa00ff);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(136,0,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: transform 0.1s;
        }
        
        .enemy.hit {
            transform: scale(1.3);
            background: #ff0000;
        }
        
        .enemy.dead {
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }
        
        /* Boss */
        .boss {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff00aa, #aa0066);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,0,170,0.7);
            font-size: 30px;
        }
        
        /* Coins */
        .coin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #ffcc00, #ffaa00);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
            animation: spin 1s linear infinite, float 2s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotateY(360deg); }
        }
        
        @keyframes float {
            0%, 100% { margin-top: 0; }
            50% { margin-top: -5px; }
        }
        
        .coin.collected {
            opacity: 0;
            transform: scale(2);
            transition: all 0.3s;
        }
        
        /* Zones */
        .zone {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }
        
        .hud-bar {
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .bar {
            width: 80px;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s;
        }
        
        .bar-fill.health { background: linear-gradient(90deg, #ff4444, #ff6666); }
        .bar-fill.energy { background: linear-gradient(90deg, #00aaff, #00ddff); }
        
        .hud-score {
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .score-label { font-size: 10px; color: #666; }
        .score-value { font-size: 24px; font-weight: bold; color: #ff4444; }
        
        /* Controls */
        #controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        
        .joystick {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: relative;
        }
        
        .joystick-stick {
            position: absolute;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff4444, #aa0000);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        
        .action-btns {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        
        .action-btn.attack {
            background: linear-gradient(135deg, #ff4444, #aa0000);
            width: 70px;
            height: 70px;
        }
        
        .action-btn.special {
            background: linear-gradient(135deg, #ffcc00, #aa8800);
            margin-bottom: 20px;
        }
        
        .action-btn:active {
            transform: scale(0.9);
        }
        
        /* Notifications */
        #notifications {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            text-align: center;
        }
        
        .notif {
            background: rgba(0,0,0,0.8);
            padding: 10px 25px;
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: bold;
            animation: notifIn 0.3s, notifOut 0.3s 1.7s forwards;
        }
        
        @keyframes notifIn { from { opacity: 0; transform: translateY(-20px); } }
        @keyframes notifOut { to { opacity: 0; } }
        
        /* Menu */
        #menu {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        
        #menu.hidden { display: none; }
        
        .menu-title {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: 900;
            background: linear-gradient(180deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1;
            margin-bottom: 10px;
        }
        
        .menu-sub {
            font-size: 20px;
            margin-bottom: 40px;
        }
        
        .menu-btn {
            width: 250px;
            padding: 15px;
            margin: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .menu-btn:hover, .menu-btn:active {
            background: linear-gradient(180deg, rgba(255,0,0,0.3), rgba(255,0,0,0.1));
            border-color: #ff4444;
        }
        
        .menu-btn.primary {
            background: linear-gradient(180deg, #ff4444, #aa0000);
            border: none;
        }
        
        /* Boss HUD */
        #boss-hud {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            display: none;
            z-index: 100;
        }
        
        #boss-hud.visible { display: block; }
        
        .boss-name {
            font-size: 18px;
            font-weight: bold;
            color: #ff00aa;
            margin-bottom: 5px;
        }
        
        .boss-bar {
            width: 250px;
            height: 15px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ff00aa;
        }
        
        .boss-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff00aa, #aa0066);
            transition: width 0.3s;
        }
        
        /* Damage flash */
        #damage-flash {
            position: fixed;
            inset: 0;
            background: rgba(255,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            z-index: 50;
        }
        
        #damage-flash.visible {
            opacity: 1;
            animation: flash 0.2s;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="player"><div class="player-eyes"><div class="player-eye"></div><div class="player-eye"></div></div></div>
    </div>
    
    <div id="hud">
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <div class="hud-bar">
                <span>❤️</span>
                <div class="bar"><div class="bar-fill health" id="health-bar" style="width: 100%"></div></div>
                <span id="health-val">100</span>
            </div>
            <div class="hud-bar">
                <span>⚡</span>
                <div class="bar"><div class="bar-fill energy" id="energy-bar" style="width: 100%"></div></div>
                <span id="energy-val">100</span>
            </div>
        </div>
        <div class="hud-score">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score">0</div>
        </div>
    </div>
    
    <div id="boss-hud">
        <div class="boss-name" id="boss-name">BOSS</div>
        <div class="boss-bar"><div class="boss-bar-fill" id="boss-bar" style="width: 100%"></div></div>
    </div>
    
    <div id="controls">
        <div class="joystick" id="joystick">
            <div class="joystick-stick" id="stick"></div>
        </div>
        <div class="action-btns">
            <button class="action-btn special" id="btn-special">⚡</button>
            <button class="action-btn attack" id="btn-attack">🔥</button>
        </div>
    </div>
    
    <div id="notifications"></div>
    <div id="damage-flash"></div>
    
    <div id="menu">
        <div class="menu-title">AI ROASTERS</div>
        <div class="menu-sub">🐕 🤝 🔫</div>
        <button class="menu-btn primary" onclick="startGame()">▶ PLAY</button>
        <button class="menu-btn" onclick="startGame('boss')">👹 BOSS RUSH</button>
    </div>

    <script>
        // Game state
        const game = document.getElementById('game');
        const playerEl = document.getElementById('player');
        let playing = false;
        let player = { x: window.innerWidth / 2, y: window.innerHeight / 2, health: 100, energy: 100, score: 0 };
        let enemies = [];
        let coins = [];
        let boss = null;
        let joystickX = 0, joystickY = 0;
        
        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, dur, type = 'square') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }
        
        // Start game
        function startGame(mode) {
            document.getElementById('menu').classList.add('hidden');
            playing = true;
            
            // Spawn enemies
            for (let i = 0; i < 15; i++) spawnEnemy();
            
            // Spawn coins
            for (let i = 0; i < 30; i++) spawnCoin();
            
            // Boss mode
            if (mode === 'boss') spawnBoss();
            
            notify('🎮 GO!');
            playSound(440, 0.2, 'sine');
            gameLoop();
        }
        
        function spawnEnemy() {
            const el = document.createElement('div');
            el.className = 'enemy';
            el.textContent = '👾';
            el.style.left = Math.random() * (window.innerWidth - 40) + 'px';
            el.style.top = Math.random() * (window.innerHeight - 200) + 100 + 'px';
            game.appendChild(el);
            enemies.push({ 
                el, 
                x: parseFloat(el.style.left), 
                y: parseFloat(el.style.top),
                hp: 30,
                speed: 1 + Math.random()
            });
        }
        
        function spawnBoss() {
            const el = document.createElement('div');
            el.className = 'enemy boss';
            el.textContent = '👹';
            el.style.left = window.innerWidth / 2 - 40 + 'px';
            el.style.top = '150px';
            game.appendChild(el);
            boss = { el, x: window.innerWidth / 2 - 40, y: 150, hp: 300, maxHp: 300 };
            document.getElementById('boss-hud').classList.add('visible');
            document.getElementById('boss-name').textContent = 'ROAST TITAN';
            notify('👹 BOSS APPEARED!');
        }
        
        function spawnCoin() {
            const el = document.createElement('div');
            el.className = 'coin';
            el.style.left = Math.random() * (window.innerWidth - 30) + 'px';
            el.style.top = Math.random() * (window.innerHeight - 200) + 100 + 'px';
            game.appendChild(el);
            coins.push({ el, collected: false });
        }
        
        // Controls
        const joystick = document.getElementById('joystick');
        const stick = document.getElementById('stick');
        
        joystick.addEventListener('touchstart', e => e.preventDefault());
        joystick.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = joystick.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = e.touches[0].clientX - cx;
            let dy = e.touches[0].clientY - cy;
            const max = 30;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
            stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickX = dx / max;
            joystickY = dy / max;
        });
        joystick.addEventListener('touchend', () => {
            joystickX = 0; joystickY = 0;
            stick.style.transform = 'translate(-50%, -50%)';
        });
        
        // Keyboard
        const keys = {};
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);
        
        // Attack
        document.getElementById('btn-attack').addEventListener('touchstart', e => { e.preventDefault(); attack(); });
        document.getElementById('btn-attack').addEventListener('click', attack);
        document.getElementById('btn-special').addEventListener('touchstart', e => { e.preventDefault(); specialAttack(); });
        document.addEventListener('click', () => { if (playing) attack(); });
        
        function attack() {
            if (player.energy < 10) return;
            player.energy -= 10;
            playSound(200, 0.1);
            
            const range = 80;
            enemies.forEach(e => {
                const dist = Math.sqrt(Math.pow(e.x - player.x, 2) + Math.pow(e.y - player.y, 2));
                if (dist < range) {
                    e.hp -= 15;
                    e.el.classList.add('hit');
                    setTimeout(() => e.el.classList.remove('hit'), 100);
                    playSound(100, 0.1, 'sawtooth');
                    
                    if (e.hp <= 0) {
                        e.el.classList.add('dead');
                        player.score += 50;
                        setTimeout(() => {
                            e.el.remove();
                            enemies = enemies.filter(x => x !== e);
                            if (enemies.length < 10) spawnEnemy();
                        }, 300);
                    }
                }
            });
            
            if (boss) {
                const dist = Math.sqrt(Math.pow(boss.x + 40 - player.x, 2) + Math.pow(boss.y + 40 - player.y, 2));
                if (dist < 120) {
                    boss.hp -= 10;
                    document.getElementById('boss-bar').style.width = (boss.hp / boss.maxHp * 100) + '%';
                    playSound(80, 0.15, 'sawtooth');
                    
                    if (boss.hp <= 0) {
                        boss.el.remove();
                        boss = null;
                        document.getElementById('boss-hud').classList.remove('visible');
                        player.score += 500;
                        notify('👹 BOSS DEFEATED!');
                        playSound(523, 0.3, 'sine');
                    }
                }
            }
            
            updateHUD();
        }
        
        function specialAttack() {
            if (player.energy < 50) return;
            player.energy -= 50;
            playSound(100, 0.3, 'sawtooth');
            
            enemies.forEach(e => {
                const dist = Math.sqrt(Math.pow(e.x - player.x, 2) + Math.pow(e.y - player.y, 2));
                if (dist < 150) {
                    e.hp -= 30;
                    if (e.hp <= 0) {
                        e.el.classList.add('dead');
                        player.score += 50;
                        setTimeout(() => {
                            e.el.remove();
                            enemies = enemies.filter(x => x !== e);
                            spawnEnemy();
                        }, 300);
                    }
                }
            });
            
            notify('⚡ SPECIAL!');
            updateHUD();
        }
        
        function notify(text) {
            const n = document.createElement('div');
            n.className = 'notif';
            n.textContent = text;
            n.style.color = text.includes('👹') ? '#ff00aa' : text.includes('⚡') ? '#ffcc00' : '#fff';
            document.getElementById('notifications').appendChild(n);
            setTimeout(() => n.remove(), 2000);
        }
        
        function updateHUD() {
            document.getElementById('health-bar').style.width = player.health + '%';
            document.getElementById('health-val').textContent = Math.floor(player.health);
            document.getElementById('energy-bar').style.width = player.energy + '%';
            document.getElementById('energy-val').textContent = Math.floor(player.energy);
            document.getElementById('score').textContent = player.score;
        }
        
        // Game loop
        function gameLoop() {
            if (!playing) return;
            
            // Move player
            let mx = joystickX, my = joystickY;
            if (keys['KeyW'] || keys['ArrowUp']) my = -1;
            if (keys['KeyS'] || keys['ArrowDown']) my = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) mx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
            
            const speed = 5;
            player.x += mx * speed;
            player.y += my * speed;
            
            // Bounds
            player.x = Math.max(20, Math.min(window.innerWidth - 60, player.x));
            player.y = Math.max(80, Math.min(window.innerHeight - 150, player.y));
            
            playerEl.style.left = player.x + 'px';
            playerEl.style.top = player.y + 'px';
            
            // Regen
            player.energy = Math.min(100, player.energy + 0.2);
            player.health = Math.min(100, player.health + 0.02);
            
            // Enemies chase
            enemies.forEach(e => {
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 30) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                    e.el.style.left = e.x + 'px';
                    e.el.style.top = e.y + 'px';
                } else {
                    // Damage player
                    player.health -= 0.3;
                    if (Math.random() < 0.02) {
                        document.getElementById('damage-flash').classList.add('visible');
                        setTimeout(() => document.getElementById('damage-flash').classList.remove('visible'), 200);
                    }
                }
            });
            
            // Boss
            if (boss) {
                const dx = player.x - boss.x;
                const dy = player.y - boss.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 60) {
                    boss.x += (dx / dist) * 0.8;
                    boss.y += (dy / dist) * 0.8;
                    boss.el.style.left = boss.x + 'px';
                    boss.el.style.top = boss.y + 'px';
                } else {
                    player.health -= 0.5;
                }
            }
            
            // Coins
            coins.forEach(c => {
                if (c.collected) return;
                const rect = c.el.getBoundingClientRect();
                const dist = Math.sqrt(Math.pow(rect.left - player.x, 2) + Math.pow(rect.top - player.y, 2));
                if (dist < 40) {
                    c.collected = true;
                    c.el.classList.add('collected');
                    player.score += 10;
                    playSound(880, 0.1, 'sine');
                    setTimeout(() => c.el.remove(), 300);
                }
            });
            
            // Death
            if (player.health <= 0) {
                player.health = 100;
                player.x = window.innerWidth / 2;
                player.y = window.innerHeight / 2;
                player.score = Math.max(0, player.score - 100);
                notify('☠️ RESPAWN');
                playSound(80, 0.3, 'sawtooth');
            }
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }
        
        // Handle resize
        window.addEventListener('resize', () => {
            player.x = Math.min(player.x, window.innerWidth - 60);
            player.y = Math.min(player.y, window.innerHeight - 150);
        });
    </script>
</body>
</html>
