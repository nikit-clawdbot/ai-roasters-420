<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ROASTERS — v30</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #000; color: white; overflow: hidden; touch-action: none; }
        
        #game { position: fixed; inset: 0; background: linear-gradient(180deg, #0a0a15 0%, #151525 100%); }
        
        #player {
            position: absolute; width: 40px; height: 60px;
            background: linear-gradient(180deg, #ff4444, #aa0000);
            border-radius: 20px 20px 10px 10px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            z-index: 10;
        }
        #player::before { content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 25px; height: 25px; background: #ffddcc; border-radius: 50%; }
        .player-eyes { position: absolute; top: 12px; display: flex; gap: 6px; left: 50%; transform: translateX(-50%); }
        .player-eye { width: 5px; height: 5px; background: #ff0000; border-radius: 50%; box-shadow: 0 0 5px #ff0000; }
        
        .enemy { position: absolute; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
        .enemy.normal { width: 35px; height: 35px; background: linear-gradient(135deg, #8800ff, #aa00ff); box-shadow: 0 0 15px rgba(136,0,255,0.5); font-size: 18px; }
        .enemy.fast { width: 25px; height: 25px; background: linear-gradient(135deg, #ff8800, #ffaa00); box-shadow: 0 0 15px rgba(255,136,0,0.5); font-size: 14px; }
        .enemy.tank { width: 50px; height: 50px; background: linear-gradient(135deg, #00aa44, #00ff66); box-shadow: 0 0 15px rgba(0,255,100,0.5); font-size: 24px; }
        .enemy.shooter { width: 35px; height: 35px; background: linear-gradient(135deg, #ff0066, #ff3399); box-shadow: 0 0 15px rgba(255,0,102,0.5); font-size: 18px; }
        .enemy.hit { transform: scale(1.3); filter: brightness(2); }
        .enemy.dead { opacity: 0; transform: scale(0); transition: all 0.3s; }
        
        .boss { width: 80px; height: 80px; background: linear-gradient(135deg, #ff00aa, #aa0066); border-radius: 15px; box-shadow: 0 0 30px rgba(255,0,170,0.7); font-size: 40px; }
        
        .coin { position: absolute; width: 20px; height: 20px; background: linear-gradient(135deg, #ffcc00, #ffaa00); border-radius: 50%; box-shadow: 0 0 10px rgba(255,204,0,0.5); animation: spin 1s linear infinite, float 2s ease-in-out infinite; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        @keyframes spin { to { transform: rotateY(360deg); } }
        @keyframes float { 0%, 100% { margin-top: 0; } 50% { margin-top: -5px; } }
        .coin.collected { opacity: 0; transform: scale(2); transition: all 0.3s; }
        
        .powerup { position: absolute; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; animation: pulse 1s ease-in-out infinite; }
        .powerup.health { background: radial-gradient(circle, #ff4444, #aa0000); box-shadow: 0 0 20px rgba(255,0,0,0.7); }
        .powerup.speed { background: radial-gradient(circle, #00aaff, #0066aa); box-shadow: 0 0 20px rgba(0,170,255,0.7); }
        .powerup.damage { background: radial-gradient(circle, #ffaa00, #aa6600); box-shadow: 0 0 20px rgba(255,170,0,0.7); }
        .powerup.shield { background: radial-gradient(circle, #00ffaa, #00aa66); box-shadow: 0 0 20px rgba(0,255,170,0.7); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        .projectile { position: absolute; width: 8px; height: 8px; background: #ff0066; border-radius: 50%; box-shadow: 0 0 10px #ff0066; }
        
        #hud { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .hud-left { display: flex; flex-direction: column; gap: 5px; }
        .hud-bar { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; }
        .bar { width: 80px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
        .bar-fill.health { background: linear-gradient(90deg, #ff4444, #ff6666); }
        .bar-fill.energy { background: linear-gradient(90deg, #00aaff, #00ddff); }
        .bar-fill.xp { background: linear-gradient(90deg, #ffcc00, #ffee00); }
        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .hud-score { background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; text-align: center; }
        .score-label { font-size: 10px; color: #666; }
        .score-value { font-size: 24px; font-weight: bold; color: #ff4444; }
        .hud-wave { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #ffcc00; }
        .hud-combo { font-size: 18px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        
        #boss-hud { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); text-align: center; display: none; z-index: 100; }
        #boss-hud.visible { display: block; }
        .boss-name { font-size: 16px; font-weight: bold; color: #ff00aa; margin-bottom: 5px; }
        .boss-bar { width: 200px; height: 12px; background: rgba(0,0,0,0.7); border-radius: 6px; overflow: hidden; border: 1px solid #ff00aa; }
        .boss-bar-fill { height: 100%; background: linear-gradient(90deg, #ff00aa, #aa0066); transition: width 0.3s; }
        
        #controls { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .joystick { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
        .joystick-stick { position: absolute; width: 45px; height: 45px; background: linear-gradient(135deg, #ff4444, #aa0000); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
        .action-btns { display: flex; gap: 10px; align-items: flex-end; }
        .action-btn { border-radius: 50%; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
        .action-btn.attack { width: 70px; height: 70px; background: linear-gradient(135deg, #ff4444, #aa0000); }
        .action-btn.special { width: 55px; height: 55px; background: linear-gradient(135deg, #ffcc00, #aa8800); margin-bottom: 20px; }
        .action-btn.dash { width: 50px; height: 50px; background: linear-gradient(135deg, #00aaff, #0066aa); margin-bottom: 40px; }
        .action-btn:active { transform: scale(0.9); }
        
        #notifications { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 200; text-align: center; }
        .notif { background: rgba(0,0,0,0.8); padding: 10px 25px; margin-bottom: 5px; font-size: 18px; font-weight: bold; animation: notifIn 0.3s, notifOut 0.3s 1.7s forwards; }
        @keyframes notifIn { from { opacity: 0; transform: translateY(-20px); } }
        @keyframes notifOut { to { opacity: 0; } }
        
        #damage-flash { position: fixed; inset: 0; background: rgba(255,0,0,0.3); pointer-events: none; opacity: 0; z-index: 50; }
        #damage-flash.visible { opacity: 1; animation: flash 0.2s; }
        @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        
        #menu { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        #menu.hidden { display: none; }
        .menu-title { font-size: clamp(40px, 12vw, 80px); font-weight: 900; background: linear-gradient(180deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; line-height: 1; margin-bottom: 10px; }
        .menu-sub { font-size: 20px; margin-bottom: 10px; }
        .menu-version { font-size: 12px; color: #666; margin-bottom: 30px; }
        .menu-btn { width: 250px; padding: 15px; margin: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .menu-btn:hover, .menu-btn:active { background: linear-gradient(180deg, rgba(255,0,0,0.3), rgba(255,0,0,0.1)); border-color: #ff4444; }
        .menu-btn.primary { background: linear-gradient(180deg, #ff4444, #aa0000); border: none; }
        
        #wave-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none; z-index: 150; transition: opacity 0.3s; }
        #wave-banner.visible { opacity: 1; }
        .wave-title { font-size: clamp(40px, 10vw, 60px); font-weight: 900; color: #ffcc00; text-shadow: 0 0 30px rgba(255,204,0,0.5); }
        .wave-sub { font-size: 14px; color: #888; margin-top: 10px; }
        
        /* MINIMAP */
        #minimap { position: fixed; bottom: 140px; left: 20px; width: 100px; height: 100px; background: rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; overflow: hidden; z-index: 90; }
        .minimap-player { position: absolute; width: 6px; height: 6px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 5px #ff4444; transform: translate(-50%, -50%); z-index: 3; }
        .minimap-enemy { position: absolute; width: 4px; height: 4px; background: #8800ff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; }
        .minimap-enemy.boss { width: 8px; height: 8px; background: #ff00aa; }
        .minimap-coin { position: absolute; width: 3px; height: 3px; background: #ffcc00; border-radius: 50%; transform: translate(-50%, -50%); z-index: 1; }
        .minimap-powerup { position: absolute; width: 4px; height: 4px; background: #00ffaa; border-radius: 50%; transform: translate(-50%, -50%); z-index: 1; }
        
        @media (max-width: 500px) { #minimap { width: 70px; height: 70px; bottom: 130px; left: 15px; } }
    </style>
</head>
<body>
    <div id="game">
        <div id="player"><div class="player-eyes"><div class="player-eye"></div><div class="player-eye"></div></div></div>
    </div>
    
    <div id="minimap"></div>
    
    <div id="hud">
        <div class="hud-left">
            <div class="hud-bar">
                <span>❤️</span>
                <div class="bar"><div class="bar-fill health" id="health-bar"></div></div>
                <span id="health-val">100</span>
            </div>
            <div class="hud-bar">
                <span>⚡</span>
                <div class="bar"><div class="bar-fill energy" id="energy-bar"></div></div>
                <span id="energy-val">100</span>
            </div>
            <div class="hud-bar">
                <span>⭐</span>
                <div class="bar"><div class="bar-fill xp" id="xp-bar"></div></div>
                <span id="level-val">LV 1</span>
            </div>
        </div>
        <div class="hud-right">
            <div class="hud-score">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="hud-wave" id="wave-display">WAVE 1</div>
            <div class="hud-combo" id="combo-display"></div>
        </div>
    </div>
    
    <div id="boss-hud">
        <div class="boss-name" id="boss-name">BOSS</div>
        <div class="boss-bar"><div class="boss-bar-fill" id="boss-bar"></div></div>
    </div>
    
    <div id="controls">
        <div class="joystick" id="joystick">
            <div class="joystick-stick" id="stick"></div>
        </div>
        <div class="action-btns">
            <button class="action-btn dash" id="btn-dash">💨</button>
            <button class="action-btn special" id="btn-special">⚡</button>
            <button class="action-btn attack" id="btn-attack">🔥</button>
        </div>
    </div>
    
    <div id="notifications"></div>
    <div id="damage-flash"></div>
    <div id="wave-banner"><div class="wave-title" id="wave-title">WAVE 1</div><div class="wave-sub" id="wave-sub">Get ready!</div></div>
    
    <div id="menu">
        <div class="menu-title">AI ROASTERS</div>
        <div class="menu-sub">🐕 🤝 🔫</div>
        <div class="menu-version">v35 — DASH MECHANIC</div>
        <button class="menu-btn primary" onclick="startGame('normal')">▶ PLAY</button>
        <button class="menu-btn" onclick="startGame('boss')">👹 BOSS RUSH</button>
        <button class="menu-btn" onclick="startGame('endless')">∞ ENDLESS</button>
    </div>

    <script>
        const game = document.getElementById('game');
        const playerEl = document.getElementById('player');
        let playing = false, gameMode = 'normal';
        
        // Player stats
        let player = { 
            x: window.innerWidth / 2, 
            y: window.innerHeight / 2, 
            health: 100, maxHealth: 100,
            energy: 100, maxEnergy: 100,
            xp: 0, level: 1,
            score: 0, 
            combo: 0, comboTimer: 0,
            damage: 15, speed: 5,
            shield: false, shieldTimer: 0
        };
        
        // Game state
        let enemies = [], coins = [], powerups = [], projectiles = [];
        let boss = null;
        let wave = 1, enemiesKilledThisWave = 0, enemiesPerWave = 10;
        let joystickX = 0, joystickY = 0;
        
        // Enemy types
        const enemyTypes = {
            normal: { emoji: '👾', hp: 30, speed: 1.5, damage: 5, score: 50, xp: 10 },
            fast: { emoji: '⚡', hp: 15, speed: 4, damage: 3, score: 30, xp: 5 },
            tank: { emoji: '🛡️', hp: 80, speed: 0.8, damage: 10, score: 100, xp: 25 },
            shooter: { emoji: '🔫', hp: 25, speed: 1, damage: 8, score: 80, xp: 20, shoots: true }
        };
        
        const bossNames = ['ROAST TITAN', 'DR. SYNTHESIS', 'VOID LORD', 'THE DELEGATE', 'ARCADE KING'];
        
        // Audio
        let audioCtx;
        function playSound(freq, dur, type = 'square') {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }
        
        function startGame(mode) {
            gameMode = mode;
            document.getElementById('menu').classList.add('hidden');
            playing = true;
            wave = 1;
            enemiesKilledThisWave = 0;
            
            // Reset player
            player = { x: window.innerWidth / 2, y: window.innerHeight / 2, health: 100, maxHealth: 100, energy: 100, maxEnergy: 100, xp: 0, level: 1, score: 0, combo: 0, comboTimer: 0, damage: 15, speed: 5, shield: false, shieldTimer: 0 };
            
            // Clear existing
            enemies.forEach(e => e.el.remove());
            coins.forEach(c => c.el.remove());
            powerups.forEach(p => p.el.remove());
            enemies = []; coins = []; powerups = []; projectiles = [];
            
            if (mode === 'boss') {
                spawnBoss();
            } else {
                showWaveBanner();
                spawnWave();
            }
            
            for (let i = 0; i < 20; i++) spawnCoin();
            
            notify('🎮 GO!');
            playSound(440, 0.2, 'sine');
            gameLoop();
        }
        
        function showWaveBanner() {
            const banner = document.getElementById('wave-banner');
            document.getElementById('wave-title').textContent = 'WAVE ' + wave;
            document.getElementById('wave-sub').textContent = wave % 5 === 0 ? '⚠️ BOSS INCOMING' : 'Enemies: ' + (enemiesPerWave + wave * 2);
            banner.classList.add('visible');
            setTimeout(() => banner.classList.remove('visible'), 2000);
        }
        
        function spawnWave() {
            const count = enemiesPerWave + wave * 2;
            for (let i = 0; i < count; i++) {
                setTimeout(() => spawnEnemy(), i * 200);
            }
            
            // Boss every 5 waves
            if (wave % 5 === 0) {
                setTimeout(() => spawnBoss(), count * 200 + 1000);
            }
            
            // Powerup every wave
            setTimeout(() => spawnPowerup(), 3000);
            
            document.getElementById('wave-display').textContent = 'WAVE ' + wave;
        }
        
        function spawnEnemy() {
            const types = Object.keys(enemyTypes);
            let type = 'normal';
            const r = Math.random();
            if (wave >= 3 && r > 0.85) type = 'shooter';
            else if (wave >= 2 && r > 0.7) type = 'tank';
            else if (r > 0.5) type = 'fast';
            
            const et = enemyTypes[type];
            const el = document.createElement('div');
            el.className = 'enemy ' + type;
            el.textContent = et.emoji;
            
            // Spawn from edges
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * window.innerWidth; y = -50; }
            else if (side === 1) { x = window.innerWidth + 50; y = Math.random() * window.innerHeight; }
            else if (side === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + 50; }
            else { x = -50; y = Math.random() * window.innerHeight; }
            
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            game.appendChild(el);
            
            enemies.push({ el, x, y, type, hp: et.hp * (1 + wave * 0.1), maxHp: et.hp * (1 + wave * 0.1), speed: et.speed, damage: et.damage, score: et.score, xp: et.xp, shoots: et.shoots, shootCooldown: 0 });
        }
        
        function spawnBoss() {
            const el = document.createElement('div');
            el.className = 'enemy boss';
            el.textContent = '👹';
            el.style.left = window.innerWidth / 2 - 40 + 'px';
            el.style.top = '100px';
            game.appendChild(el);
            
            const bossHp = 200 + wave * 50;
            boss = { el, x: window.innerWidth / 2 - 40, y: 100, hp: bossHp, maxHp: bossHp, phase: 1 };
            
            document.getElementById('boss-hud').classList.add('visible');
            document.getElementById('boss-name').textContent = bossNames[Math.floor(wave / 5) % bossNames.length];
            document.getElementById('boss-bar').style.width = '100%';
            
            notify('👹 ' + document.getElementById('boss-name').textContent + '!');
            playSound(100, 0.5, 'sawtooth');
        }
        
        function spawnCoin() {
            const el = document.createElement('div');
            el.className = 'coin';
            el.textContent = '💰';
            el.style.left = Math.random() * (window.innerWidth - 30) + 'px';
            el.style.top = Math.random() * (window.innerHeight - 200) + 100 + 'px';
            game.appendChild(el);
            coins.push({ el, collected: false });
        }
        
        function spawnPowerup() {
            const types = ['health', 'speed', 'damage', 'shield'];
            const emojis = { health: '❤️', speed: '💨', damage: '💥', shield: '🛡️' };
            const type = types[Math.floor(Math.random() * types.length)];
            
            const el = document.createElement('div');
            el.className = 'powerup ' + type;
            el.textContent = emojis[type];
            el.style.left = Math.random() * (window.innerWidth - 40) + 20 + 'px';
            el.style.top = Math.random() * (window.innerHeight - 250) + 120 + 'px';
            game.appendChild(el);
            powerups.push({ el, type, collected: false });
        }
        
        // Controls
        const joystick = document.getElementById('joystick');
        const stick = document.getElementById('stick');
        
        joystick.addEventListener('touchstart', e => e.preventDefault());
        joystick.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = joystick.getBoundingClientRect();
            let dx = e.touches[0].clientX - (rect.left + rect.width / 2);
            let dy = e.touches[0].clientY - (rect.top + rect.height / 2);
            const max = 30, dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
            stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickX = dx / max;
            joystickY = dy / max;
        });
        joystick.addEventListener('touchend', () => {
            joystickX = 0; joystickY = 0;
            stick.style.transform = 'translate(-50%, -50%)';
        });
        
        const keys = {};
        document.addEventListener('keydown', e => { 
            keys[e.code] = true; 
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dash();
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        
        document.getElementById('btn-attack').addEventListener('touchstart', e => { e.preventDefault(); attack(); });
        document.getElementById('btn-special').addEventListener('touchstart', e => { e.preventDefault(); specialAttack(); });
        document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); dash(); });
        document.addEventListener('click', e => { if (playing && !e.target.closest('#menu') && !e.target.closest('.action-btn')) attack(); });
        
        // Dash mechanic
        let dashCooldown = 0;
        let isDashing = false;
        let dashDir = { x: 0, y: 0 };
        
        function dash() {
            if (dashCooldown > 0 || player.energy < 20) return;
            
            // Get direction from joystick or keys
            let dx = joystickX, dy = joystickY;
            if (keys['KeyW'] || keys['ArrowUp']) dy = -1;
            if (keys['KeyS'] || keys['ArrowDown']) dy = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) dx = 1;
            
            if (dx === 0 && dy === 0) dx = 1; // Default right
            
            const len = Math.sqrt(dx * dx + dy * dy);
            dashDir = { x: dx / len, y: dy / len };
            
            isDashing = true;
            dashCooldown = 60; // 1 second cooldown
            player.energy -= 20;
            player.shield = true; // Invincible during dash
            
            playSound(400, 0.15, 'sine');
            notify('💨 DASH!');
            
            setTimeout(() => { isDashing = false; player.shield = false; }, 200);
        }
        document.addEventListener('click', e => { if (playing && !e.target.closest('#menu') && !e.target.closest('.action-btn')) attack(); });
        
        function attack() {
            if (player.energy < 10) return;
            player.energy -= 10;
            playSound(200, 0.1);
            
            const range = 80;
            let hitAny = false;
            
            enemies.forEach(e => {
                const dist = Math.sqrt(Math.pow(e.x - player.x, 2) + Math.pow(e.y - player.y, 2));
                if (dist < range) {
                    hitAny = true;
                    e.hp -= player.damage;
                    e.el.classList.add('hit');
                    setTimeout(() => e.el.classList.remove('hit'), 100);
                    
                    if (e.hp <= 0) killEnemy(e);
                }
            });
            
            if (boss) {
                const dist = Math.sqrt(Math.pow(boss.x + 40 - player.x, 2) + Math.pow(boss.y + 40 - player.y, 2));
                if (dist < 120) {
                    hitAny = true;
                    boss.hp -= player.damage;
                    document.getElementById('boss-bar').style.width = (boss.hp / boss.maxHp * 100) + '%';
                    playSound(80, 0.15, 'sawtooth');
                    
                    if (boss.hp <= 0) {
                        boss.el.remove();
                        player.score += 500 * wave;
                        player.xp += 100;
                        notify('👹 BOSS DEFEATED! +' + (500 * wave));
                        playSound(523, 0.3, 'sine');
                        boss = null;
                        document.getElementById('boss-hud').classList.remove('visible');
                        stats.bossKills++;
                        checkLevelUp();
                    }
                }
            }
            
            if (hitAny) {
                player.combo++;
                player.comboTimer = 2;
                playSound(100 + player.combo * 10, 0.1, 'sawtooth');
            }
            
            updateHUD();
        }
        
        function killEnemy(e) {
            e.el.classList.add('dead');
            player.score += e.score * (1 + Math.floor(player.combo / 5));
            player.xp += e.xp;
            enemiesKilledThisWave++;
            stats.kills++;
            stats.killsWithoutDamage++;
            if (e.type === 'fast') stats.fastKills++;
            
            setTimeout(() => {
                e.el.remove();
                enemies = enemies.filter(x => x !== e);
                
                // Check wave complete
                if (gameMode === 'normal' && enemies.length === 0 && !boss) {
                    wave++;
                    enemiesKilledThisWave = 0;
                    setTimeout(() => {
                        showWaveBanner();
                        spawnWave();
                    }, 1500);
                    notify('🎉 WAVE ' + (wave - 1) + ' COMPLETE!');
                }
                
                // Endless mode respawn
                if (gameMode === 'endless' && enemies.length < 10) spawnEnemy();
            }, 300);
            
            checkLevelUp();
        }
        
        function specialAttack() {
            if (player.energy < 50) return;
            player.energy -= 50;
            playSound(100, 0.3, 'sawtooth');
            
            const range = 150;
            enemies.forEach(e => {
                const dist = Math.sqrt(Math.pow(e.x - player.x, 2) + Math.pow(e.y - player.y, 2));
                if (dist < range) {
                    e.hp -= player.damage * 2;
                    if (e.hp <= 0) killEnemy(e);
                }
            });
            
            notify('⚡ SPECIAL ATTACK!');
            updateHUD();
        }
        
        function checkLevelUp() {
            const xpNeeded = player.level * 100;
            if (player.xp >= xpNeeded) {
                player.xp -= xpNeeded;
                player.level++;
                player.maxHealth += 20;
                player.health = player.maxHealth;
                player.maxEnergy += 10;
                player.energy = player.maxEnergy;
                player.damage += 5;
                notify('🎉 LEVEL ' + player.level + '!');
                playSound(523, 0.2, 'sine');
                playSound(659, 0.2, 'sine');
            }
        }
        
        function notify(text) {
            const n = document.createElement('div');
            n.className = 'notif';
            n.textContent = text;
            n.style.color = text.includes('👹') ? '#ff00aa' : text.includes('⚡') ? '#ffcc00' : text.includes('🎉') ? '#00ff88' : '#fff';
            document.getElementById('notifications').appendChild(n);
            setTimeout(() => n.remove(), 2000);
        }
        
        function updateHUD() {
            document.getElementById('health-bar').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('health-val').textContent = Math.floor(player.health);
            document.getElementById('energy-bar').style.width = (player.energy / player.maxEnergy * 100) + '%';
            document.getElementById('energy-val').textContent = Math.floor(player.energy);
            document.getElementById('xp-bar').style.width = (player.xp / (player.level * 100) * 100) + '%';
            document.getElementById('level-val').textContent = 'LV ' + player.level;
            document.getElementById('score').textContent = player.score;
            document.getElementById('combo-display').textContent = player.combo > 1 ? player.combo + 'x COMBO' : '';
        }
        
        function gameLoop() {
            if (!playing) return;
            
            // Movement
            let mx = joystickX, my = joystickY;
            if (keys['KeyW'] || keys['ArrowUp']) my = -1;
            if (keys['KeyS'] || keys['ArrowDown']) my = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) mx = -1;
            if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
            if (keys['Space']) attack();
            
            player.x += mx * player.speed;
            player.y += my * player.speed;
            
            // Dash movement
            if (isDashing) {
                player.x += dashDir.x * 25;
                player.y += dashDir.y * 25;
            }
            if (dashCooldown > 0) dashCooldown--;
            
            player.x = Math.max(20, Math.min(window.innerWidth - 60, player.x));
            player.y = Math.max(80, Math.min(window.innerHeight - 150, player.y));
            
            playerEl.style.left = player.x + 'px';
            playerEl.style.top = player.y + 'px';
            playerEl.style.boxShadow = player.shield ? '0 0 30px rgba(0,255,170,0.8)' : '0 0 20px rgba(255,0,0,0.5)';
            
            // Regen
            player.energy = Math.min(player.maxEnergy, player.energy + 0.3);
            player.health = Math.min(player.maxHealth, player.health + 0.05);
            
            // Combo decay
            if (player.comboTimer > 0) {
                player.comboTimer -= 0.016;
                if (player.comboTimer <= 0) player.combo = 0;
            }
            
            // Shield decay
            if (player.shieldTimer > 0) {
                player.shieldTimer -= 0.016;
                if (player.shieldTimer <= 0) player.shield = false;
            }
            
            // Enemy AI
            enemies.forEach(e => {
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 30) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                    e.el.style.left = e.x + 'px';
                    e.el.style.top = e.y + 'px';
                } else if (!player.shield) {
                    player.health -= e.damage * 0.016;
                    stats.killsWithoutDamage = 0;
                    if (Math.random() < 0.02) {
                        document.getElementById('damage-flash').classList.add('visible');
                        setTimeout(() => document.getElementById('damage-flash').classList.remove('visible'), 200);
                    }
                }
                
                // Shooter enemies
                if (e.shoots && e.shootCooldown <= 0 && dist < 300) {
                    e.shootCooldown = 60;
                    const proj = document.createElement('div');
                    proj.className = 'projectile';
                    proj.style.left = e.x + 15 + 'px';
                    proj.style.top = e.y + 15 + 'px';
                    game.appendChild(proj);
                    projectiles.push({ el: proj, x: e.x + 15, y: e.y + 15, dx: dx / dist * 5, dy: dy / dist * 5, life: 120 });
                }
                e.shootCooldown--;
            });
            
            // Boss AI
            if (boss) {
                const dx = player.x - boss.x;
                const dy = player.y - boss.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                boss.x += (dx / dist) * 1.2;
                boss.y += (dy / dist) * 1.2;
                boss.el.style.left = boss.x + 'px';
                boss.el.style.top = boss.y + 'px';
                
                if (dist < 60 && !player.shield) {
                    player.health -= 0.3;
                }
            }
            
            // Projectiles
            projectiles.forEach((p, i) => {
                p.x += p.dx;
                p.y += p.dy;
                p.life--;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';
                
                const dist = Math.sqrt(Math.pow(p.x - player.x, 2) + Math.pow(p.y - player.y, 2));
                if (dist < 25 && !player.shield) {
                    player.health -= 10;
                    p.life = 0;
                    document.getElementById('damage-flash').classList.add('visible');
                    setTimeout(() => document.getElementById('damage-flash').classList.remove('visible'), 200);
                }
                
                if (p.life <= 0 || p.x < 0 || p.x > window.innerWidth || p.y < 0 || p.y > window.innerHeight) {
                    p.el.remove();
                    projectiles.splice(i, 1);
                }
            });
            
            // Coins
            coins.forEach(c => {
                if (c.collected) return;
                const rect = c.el.getBoundingClientRect();
                const dist = Math.sqrt(Math.pow(rect.left - player.x, 2) + Math.pow(rect.top - player.y, 2));
                if (dist < 40) {
                    c.collected = true;
                    c.el.classList.add('collected');
                    player.score += 10;
                    player.xp += 2;
                    stats.coinsCollected++;
                    playSound(880, 0.1, 'sine');
                    setTimeout(() => { c.el.remove(); spawnCoin(); }, 300);
                }
            });
            
            // Powerups
            powerups.forEach((p, i) => {
                if (p.collected) return;
                const rect = p.el.getBoundingClientRect();
                const dist = Math.sqrt(Math.pow(rect.left - player.x, 2) + Math.pow(rect.top - player.y, 2));
                if (dist < 40) {
                    p.collected = true;
                    p.el.remove();
                    powerups.splice(i, 1);
                    
                    if (p.type === 'health') { player.health = player.maxHealth; notify('❤️ FULL HEALTH!'); }
                    else if (p.type === 'speed') { player.speed += 1; notify('💨 SPEED UP!'); }
                    else if (p.type === 'damage') { player.damage += 10; notify('💥 DAMAGE UP!'); }
                    else if (p.type === 'shield') { player.shield = true; player.shieldTimer = 10; notify('🛡️ SHIELD!'); }
                    stats.powerupsCollected++;
                    playSound(660, 0.15, 'sine');
                }
            });
            
            // Death
            if (player.health <= 0) {
                player.health = player.maxHealth;
                player.x = window.innerWidth / 2;
                player.y = window.innerHeight / 2;
                player.score = Math.max(0, player.score - 100);
                player.combo = 0;
                notify('☠️ RESPAWN');
                playSound(80, 0.3, 'sawtooth');
            }
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }
        
        window.addEventListener('resize', () => {
            player.x = Math.min(player.x, window.innerWidth - 60);
            player.y = Math.min(player.y, window.innerHeight - 150);
        });
        
        // ==================== ACHIEVEMENTS SYSTEM ====================
        const achievements = {
            firstBlood: { name: 'FIRST BLOOD', desc: 'Kill your first enemy', icon: '🩸' },
            serialRoaster: { name: 'SERIAL ROASTER', desc: 'Kill 10 enemies', icon: '🔥' },
            massacre: { name: 'MASSACRE', desc: 'Kill 100 enemies', icon: '💀' },
            bossSlayer: { name: 'BOSS SLAYER', desc: 'Defeat a boss', icon: '👹' },
            survivor: { name: 'SURVIVOR', desc: 'Survive 5 minutes', icon: '⏱️' },
            coinMaster: { name: 'COIN MASTER', desc: 'Collect 50 coins', icon: '💰' },
            highRoller: { name: 'HIGH ROLLER', desc: 'Score 1000 points', icon: '🎰' },
            comboKing: { name: 'COMBO KING', desc: 'Get 5x combo', icon: '⚡' },
            waveMaster: { name: 'WAVE MASTER', desc: 'Reach wave 10', icon: '🌊' },
            powerHungry: { name: 'POWER HUNGRY', desc: 'Collect 10 powerups', icon: '💪' },
            untouchable: { name: 'UNTOUCHABLE', desc: 'Kill 20 enemies without damage', icon: '🛡️' },
            speedDemon: { name: 'SPEED DEMON', desc: 'Kill 5 fast enemies', icon: '💨' }
        };
        
        let stats = { kills: 0, bossKills: 0, coinsCollected: 0, powerupsCollected: 0, fastKills: 0, killsWithoutDamage: 0, gameTime: 0 };
        let unlockedAchievements = JSON.parse(localStorage.getItem('ai_roasters_achievements') || '[]');
        
        function checkAchievements() {
            if (stats.kills >= 1) unlock('firstBlood');
            if (stats.kills >= 10) unlock('serialRoaster');
            if (stats.kills >= 100) unlock('massacre');
            if (stats.bossKills >= 1) unlock('bossSlayer');
            if (stats.gameTime >= 300) unlock('survivor');
            if (stats.coinsCollected >= 50) unlock('coinMaster');
            if (player.score >= 1000) unlock('highRoller');
            if (player.combo >= 5) unlock('comboKing');
            if (wave >= 10) unlock('waveMaster');
            if (stats.powerupsCollected >= 10) unlock('powerHungry');
            if (stats.killsWithoutDamage >= 20) unlock('untouchable');
            if (stats.fastKills >= 5) unlock('speedDemon');
        }
        
        function unlock(id) {
            if (unlockedAchievements.includes(id)) return;
            unlockedAchievements.push(id);
            localStorage.setItem('ai_roasters_achievements', JSON.stringify(unlockedAchievements));
            
            const a = achievements[id];
            const n = document.createElement('div');
            n.className = 'notif';
            n.textContent = '🏆 ' + a.icon + ' ' + a.name + '!';
            n.style.color = '#ffcc00';
            n.style.background = 'linear-gradient(90deg, transparent, rgba(255,204,0,0.2), transparent)';
            document.getElementById('notifications').appendChild(n);
            setTimeout(() => n.remove(), 3000);
            
            playSound(523, 0.15, 'sine');
            playSound(659, 0.15, 'sine');
            playSound(784, 0.15, 'sine');
        }
        
        // Track stats in game loop
        setInterval(() => { if (playing) { stats.gameTime++; checkAchievements(); } }, 1000);
        
        // ==================== MINIMAP ====================
        const minimap = document.getElementById('minimap');
        const mapScale = 100 / Math.max(window.innerWidth, window.innerHeight);
        
        function updateMinimap() {
            minimap.innerHTML = '';
            
            // Player dot
            const playerDot = document.createElement('div');
            playerDot.className = 'minimap-player';
            playerDot.style.left = (player.x / window.innerWidth * 100) + '%';
            playerDot.style.top = (player.y / window.innerHeight * 100) + '%';
            minimap.appendChild(playerDot);
            
            // Enemy dots
            enemies.forEach(e => {
                const dot = document.createElement('div');
                dot.className = 'minimap-enemy';
                dot.style.left = (e.x / window.innerWidth * 100) + '%';
                dot.style.top = (e.y / window.innerHeight * 100) + '%';
                minimap.appendChild(dot);
            });
            
            // Boss dot
            if (boss) {
                const dot = document.createElement('div');
                dot.className = 'minimap-enemy boss';
                dot.style.left = (boss.x / window.innerWidth * 100) + '%';
                dot.style.top = (boss.y / window.innerHeight * 100) + '%';
                minimap.appendChild(dot);
            }
            
            // Coin dots
            coins.forEach(c => {
                if (c.collected) return;
                const rect = c.el.getBoundingClientRect();
                const dot = document.createElement('div');
                dot.className = 'minimap-coin';
                dot.style.left = (rect.left / window.innerWidth * 100) + '%';
                dot.style.top = (rect.top / window.innerHeight * 100) + '%';
                minimap.appendChild(dot);
            });
            
            // Powerup dots
            powerups.forEach(p => {
                if (p.collected) return;
                const rect = p.el.getBoundingClientRect();
                const dot = document.createElement('div');
                dot.className = 'minimap-powerup';
                dot.style.left = (rect.left / window.innerWidth * 100) + '%';
                dot.style.top = (rect.top / window.innerHeight * 100) + '%';
                minimap.appendChild(dot);
            });
        }
        
        setInterval(() => { if (playing) updateMinimap(); }, 100);
    </script>
</body>
</html>
