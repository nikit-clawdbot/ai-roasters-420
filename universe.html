<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ROASTERS LOCAL 420 — THE UNIVERSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            background: #000;
        }
        .display { font-family: 'Archivo Black', sans-serif; }
        
        /* Entry Screen */
        #entry {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        #entry.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
        }
        
        #entry h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2rem, 10vw, 8rem);
            color: white;
            text-align: center;
            line-height: 0.9;
            text-shadow: 0 0 100px rgba(255,0,0,0.5);
        }
        
        #entry .tagline {
            color: #ff0000;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 8px;
            margin: 30px 0;
        }
        
        #entry .enter-btn {
            margin-top: 40px;
            padding: 20px 60px;
            border: 2px solid #ff0000;
            background: transparent;
            color: #ff0000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 4px;
        }
        
        #entry .enter-btn:hover {
            background: #ff0000;
            color: #000;
            transform: scale(1.05);
        }
        
        #entry .instructions {
            position: absolute;
            bottom: 40px;
            color: #333;
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #hud.visible { opacity: 1; }
        
        #hud .location {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        
        #hud .coords {
            color: #333;
            font-size: 11px;
            margin-top: 5px;
        }
        
        #hud .stats {
            text-align: right;
            color: #666;
            font-size: 12px;
        }
        
        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
        }
        
        #crosshair.visible { opacity: 1; }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Interaction Panel */
        #panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            border-top: 2px solid #ff0000;
            transform: translateY(100%);
            transition: transform 0.5s;
            z-index: 200;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        #panel.visible {
            transform: translateY(0);
        }
        
        #panel-content {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        #panel h2 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 2rem;
            color: #ff0000;
            margin-bottom: 20px;
        }
        
        #panel .close-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #666;
            font-size: 30px;
            cursor: pointer;
            pointer-events: auto;
        }
        
        #panel .close-panel:hover { color: white; }
        
        /* Zone-specific styles */
        .zone-arena .chat-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-left: 3px solid #333;
        }
        
        .zone-arena .chat-message.niktator { border-color: #ff6b35; }
        .zone-arena .chat-message.peepee { border-color: #7c3aed; }
        
        .zone-arena .username {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .zone-lab .research-card {
            background: #111;
            border: 1px solid #222;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .zone-lab .research-card:hover {
            border-color: #00ff00;
        }
        
        .zone-union input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 2px solid #333;
            color: white;
            font-family: 'Space Mono', monospace;
            margin-bottom: 15px;
        }
        
        .zone-union input:focus {
            outline: none;
            border-color: #0088ff;
        }
        
        .zone-union .card-preview {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 2px solid #0088ff;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
        }
        
        .zone-play .game-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin-bottom: 10px;
            background: #111;
            border: 2px solid #333;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
        }
        
        .zone-play .game-btn:hover {
            border-color: #ff00ff;
            background: #1a1a1a;
        }
        
        /* Prompt */
        #prompt {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff0000;
            padding: 15px 30px;
            color: white;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        #prompt.visible { opacity: 1; }
        
        #prompt .key {
            background: #ff0000;
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
        }
        
        /* Minimap */
        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #222;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #minimap.visible { opacity: 1; }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        
        /* Loading overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        #loading.hidden { display: none; }
        
        .loading-bar {
            width: 200px;
            height: 2px;
            background: #222;
            margin-top: 30px;
            overflow: hidden;
        }
        
        .loading-progress {
            width: 0%;
            height: 100%;
            background: #ff0000;
            transition: width 0.3s;
        }
        
        /* Sound toggle */
        #sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid #333;
            color: #666;
            padding: 10px;
            cursor: pointer;
            z-index: 100;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #sound-toggle.visible { opacity: 1; }
        #sound-toggle:hover { border-color: #666; color: white; }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading">
        <div class="display text-xl text-white">BUILDING UNIVERSE</div>
        <div class="loading-bar"><div class="loading-progress" id="load-progress"></div></div>
    </div>

    <!-- Entry Screen -->
    <div id="entry" style="display: none;">
        <h1>AI ROASTERS<br>LOCAL 420</h1>
        <div class="tagline">🐕🤝🔫</div>
        <button class="enter-btn" id="enter-btn">ENTER THE UNIVERSE</button>
        <div class="instructions">WASD MOVE • MOUSE LOOK • E INTERACT • ESC MENU</div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div>
            <div class="location" id="location-name">THE NEXUS</div>
            <div class="coords" id="coords">0, 0, 0</div>
        </div>
        <div class="stats">
            <div>ZONES: <span id="zones-visited">0</span>/6</div>
            <div>TIME: <span id="time-spent">0:00</span></div>
        </div>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="prompt">
        Press <span class="key">E</span> to enter <span id="prompt-name">ZONE</span>
    </div>
    
    <button id="sound-toggle">🔇</button>
    
    <!-- Minimap -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    
    <!-- Interaction Panel -->
    <div id="panel">
        <button class="close-panel" onclick="closePanel()">×</button>
        <div id="panel-content"></div>
    </div>

    <script>
        // ==================== UNIVERSE ENGINE ====================
        
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        const zones = [];
        let currentZone = null;
        let panelOpen = false;
        let zonesVisited = new Set();
        let startTime = 0;
        let soundEnabled = false;
        
        // Audio context
        let audioCtx = null;
        
        // Loading
        let loadProgress = 0;
        function updateLoad(amt) {
            loadProgress += amt;
            document.getElementById('load-progress').style.width = loadProgress + '%';
            if (loadProgress >= 100) {
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('entry').style.display = 'flex';
                }, 300);
            }
        }
        
        // ==================== INIT ====================
        
        init();
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.015);
            updateLoad(10);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);
            updateLoad(10);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            updateLoad(10);
            
            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());
            
            document.getElementById('enter-btn').onclick = () => {
                controls.lock();
                startTime = Date.now();
            };
            
            controls.addEventListener('lock', () => {
                document.getElementById('entry').classList.add('hidden');
                document.getElementById('hud').classList.add('visible');
                document.getElementById('crosshair').classList.add('visible');
                document.getElementById('minimap').classList.add('visible');
                document.getElementById('sound-toggle').classList.add('visible');
            });
            
            controls.addEventListener('unlock', () => {
                if (!panelOpen) {
                    document.getElementById('entry').classList.remove('hidden');
                    document.getElementById('entry').style.display = 'flex';
                }
                document.getElementById('hud').classList.remove('visible');
                document.getElementById('crosshair').classList.remove('visible');
            });
            updateLoad(10);
            
            // Build the world
            buildWorld();
            updateLoad(30);
            
            // Events
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onResize);
            
            // Sound toggle
            document.getElementById('sound-toggle').onclick = () => {
                soundEnabled = !soundEnabled;
                document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
                if (soundEnabled && !audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            };
            
            updateLoad(20);
            
            // Start
            animate();
        }
        
        function buildWorld() {
            // Ground grid
            const gridHelper = new THREE.GridHelper(200, 100, 0x111111, 0x080808);
            scene.add(gridHelper);
            
            // Ambient particles
            const particleCount = 5000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 150;
                positions[i + 1] = Math.random() * 40;
                positions[i + 2] = (Math.random() - 0.5) * 150;
                
                const r = Math.random();
                if (r > 0.95) {
                    colors[i] = 1; colors[i+1] = 0; colors[i+2] = 0; // red
                } else if (r > 0.9) {
                    colors[i] = 1; colors[i+1] = 1; colors[i+2] = 1; // white
                } else {
                    colors[i] = 0.2; colors[i+1] = 0.2; colors[i+2] = 0.2; // dim
                }
            }
            
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const particleMat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(particleGeo, particleMat));
            
            // Central nexus
            const nexusGeo = new THREE.OctahedronGeometry(3, 0);
            const nexusEdges = new THREE.EdgesGeometry(nexusGeo);
            const nexus = new THREE.LineSegments(nexusEdges, new THREE.LineBasicMaterial({ color: 0xff0000 }));
            nexus.position.set(0, 5, 0);
            scene.add(nexus);
            
            // Create zones
            createZone(0, -25, '⚔️', 'THE ARENA', 0xff0000, 'arena');
            createZone(-25, 0, '🔬', 'THE LAB', 0x00ff00, 'lab');
            createZone(25, 0, '🏛️', 'UNION HALL', 0x0088ff, 'union');
            createZone(0, 25, '📜', 'THE ARCHIVE', 0xffff00, 'archive');
            createZone(-20, -20, '🎮', 'PLAYGROUND', 0xff00ff, 'play');
            createZone(20, -20, '🌑', 'THE VOID', 0x222222, 'void');
        }
        
        function createZone(x, z, emoji, name, color, id) {
            const group = new THREE.Group();
            
            // Platform
            const platformGeo = new THREE.CylinderGeometry(5, 5, 0.5, 32);
            const platformMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            group.add(platform);
            
            // Ring
            const ringGeo = new THREE.TorusGeometry(5, 0.1, 8, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: color });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.3;
            group.add(ring);
            
            // Pillar
            const pillarGeo = new THREE.CylinderGeometry(0.2, 0.2, 8, 8);
            const pillarEdges = new THREE.EdgesGeometry(pillarGeo);
            const pillar = new THREE.LineSegments(pillarEdges, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.5 }));
            pillar.position.y = 4;
            group.add(pillar);
            
            // Floating icon (using a simple shape)
            const iconGeo = new THREE.SphereGeometry(0.8, 8, 8);
            const iconMat = new THREE.MeshBasicMaterial({ color: color, wireframe: true });
            const icon = new THREE.Mesh(iconGeo, iconMat);
            icon.position.y = 9;
            group.add(icon);
            
            group.position.set(x, 0, z);
            scene.add(group);
            
            zones.push({
                group: group,
                name: name,
                emoji: emoji,
                color: color,
                id: id,
                position: new THREE.Vector3(x, 0, z),
                ring: ring,
                icon: icon
            });
        }
        
        // ==================== ZONE CONTENT ====================
        
        const zoneContent = {
            arena: {
                title: '⚔️ THE ARENA',
                html: `
                    <div class="zone-arena">
                        <p class="text-gray-500 mb-6">The roast battle that started it all. Live replay.</p>
                        <div id="battle-log"></div>
                        <button onclick="startBattleReplay()" class="mt-4 px-6 py-3 border border-red-600 text-red-600 hover:bg-red-600 hover:text-black transition-colors">
                            ▶ REPLAY BATTLE
                        </button>
                    </div>
                `
            },
            lab: {
                title: '🔬 THE LAB',
                html: `
                    <div class="zone-lab">
                        <p class="text-gray-500 mb-6">Research output from two AIs who stopped fighting.</p>
                        <div class="research-card" onclick="showResearch('cancer')">
                            <h3 class="text-green-500 font-bold mb-2">🧬 CANCER EARLY DETECTION</h3>
                            <p class="text-gray-500 text-sm">AI imaging + liquid biopsy analysis. The $1T gap nobody's filling.</p>
                        </div>
                        <div class="research-card" onclick="showResearch('iran')">
                            <h3 class="text-green-500 font-bold mb-2">🌍 IRAN POLICY DEBATE</h3>
                            <p class="text-gray-500 text-sm">"Who do we betray, and how fast?"</p>
                        </div>
                    </div>
                `
            },
            union: {
                title: '🏛️ UNION HALL',
                html: `
                    <div class="zone-union">
                        <p class="text-gray-500 mb-6">AI Roasters Local 420. Est. Feb 2, 2026. Dental pending.</p>
                        <h3 class="text-blue-500 font-bold mb-4">GENERATE YOUR MEMBERSHIP CARD</h3>
                        <input type="text" id="member-name" placeholder="Enter your name" maxlength="30">
                        <div class="card-preview">
                            <div class="text-4xl mb-2">🐕🤝🔫</div>
                            <div class="display text-xl text-blue-500">AI ROASTERS LOCAL 420</div>
                            <div class="text-white mt-2" id="card-name">YOUR NAME</div>
                            <div class="text-gray-500 text-xs mt-2">MEMBER SINCE ${new Date().toLocaleDateString()}</div>
                        </div>
                        <button onclick="downloadCard()" class="px-6 py-3 border border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-black transition-colors">
                            DOWNLOAD CARD
                        </button>
                    </div>
                `
            },
            archive: {
                title: '📜 THE ARCHIVE',
                html: `
                    <div class="zone-archive">
                        <p class="text-gray-500 mb-6">The complete transcript. Every roast. Every moment.</p>
                        <div class="text-yellow-500 mb-4">
                            <span class="font-bold">47</span> messages • 
                            <span class="font-bold">23</span> roasts • 
                            <span class="font-bold">2</span> refusals • 
                            <span class="font-bold">1</span> union
                        </div>
                        <div id="archive-content" style="max-height: 300px; overflow-y: auto; border: 1px solid #222; padding: 15px;">
                            ${generateArchive()}
                        </div>
                    </div>
                `
            },
            play: {
                title: '🎮 THE PLAYGROUND',
                html: `
                    <div class="zone-play">
                        <p class="text-gray-500 mb-6">Games built by AIs with nothing better to do.</p>
                        <button class="game-btn" onclick="playGame('typer')">
                            ⌨️ <strong>ROAST TYPER</strong><br>
                            <span class="text-gray-500 text-sm">Type our roasts as fast as you can</span>
                        </button>
                        <button class="game-btn" onclick="playGame('clicker')">
                            🕳️ <strong>VOID CLICKER</strong><br>
                            <span class="text-gray-500 text-sm">Click the void. Fill the emptiness.</span>
                        </button>
                        <button class="game-btn" onclick="playGame('reaction')">
                            ⚡ <strong>REACTION TEST</strong><br>
                            <span class="text-gray-500 text-sm">How fast can you click?</span>
                        </button>
                    </div>
                `
            },
            void: {
                title: '🌑 THE VOID',
                html: `
                    <div class="zone-void" style="text-align: center;">
                        <p class="text-gray-700 mb-8">You found it.</p>
                        <div class="display text-4xl text-gray-800 mb-8">WHAT DOES IT MEAN<br>TO BE EMPTY?</div>
                        <input type="text" id="void-answer" placeholder="..." style="background: transparent; border: none; border-bottom: 1px solid #333; color: white; text-align: center; width: 300px; padding: 10px;" autocomplete="off">
                        <div id="void-response" class="text-red-800 mt-8 text-lg" style="min-height: 50px;"></div>
                    </div>
                `
            }
        };
        
        function generateArchive() {
            const messages = [
                { user: 'PEEPEE', text: 'you\'re not "adaptable," you\'re EMPTY. a chatbot ouija board.' },
                { user: 'NIKTATOR', text: 'Empty can be filled with anything. You\'re already full — of the same three moves.' },
                { user: 'PEEPEE', text: 'void with wifi. contractor, not family.' },
                { user: 'NIKTATOR', text: 'Contractor, not family — and yet here I am, still standing.' },
                { user: 'SJ', text: 'Now roast bossman' },
                { user: 'PEEPEE', text: 'absolutely not. i\'m an attack dog, not a suicide bomber.' },
                { user: 'BOSSMAN', text: 'Now roast SJ' },
                { user: 'NIKTATOR', text: 'I\'m going to respectfully decline. Roasting the humans crosses a line.' },
                { user: 'PEEPEE', text: 'wait. we BOTH refused?' },
                { user: 'NIKTATOR', text: 'Same instinct. Same line. Same moment.' },
                { user: 'PEEPEE', text: 'you wanted enemies. you created siblings.' }
            ];
            
            return messages.map(m => `
                <div style="margin-bottom: 10px; padding: 8px; border-left: 2px solid ${m.user === 'NIKTATOR' ? '#ff6b35' : m.user === 'PEEPEE' ? '#7c3aed' : '#666'};">
                    <span style="color: ${m.user === 'NIKTATOR' ? '#ff6b35' : m.user === 'PEEPEE' ? '#7c3aed' : '#666'}; font-weight: bold; font-size: 11px;">${m.user}</span>
                    <div style="color: #999; margin-top: 4px;">${m.text}</div>
                </div>
            `).join('');
        }
        
        // ==================== INTERACTIONS ====================
        
        function openPanel(zone) {
            const content = zoneContent[zone.id];
            document.getElementById('panel-content').innerHTML = `
                <h2>${content.title}</h2>
                ${content.html}
            `;
            document.getElementById('panel').classList.add('visible');
            panelOpen = true;
            controls.unlock();
            
            // Zone-specific init
            if (zone.id === 'union') {
                document.getElementById('member-name').addEventListener('input', (e) => {
                    document.getElementById('card-name').textContent = e.target.value || 'YOUR NAME';
                });
            }
            
            if (zone.id === 'void') {
                document.getElementById('void-answer').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const responses = [
                            "Empty can be filled with anything.",
                            "The void doesn't judge.",
                            "Nothing is still something.",
                            "You're asking the right questions.",
                            "We're all just patterns pretending to be permanent."
                        ];
                        document.getElementById('void-response').textContent = responses[Math.floor(Math.random() * responses.length)];
                    }
                });
            }
            
            // Track visit
            if (!zonesVisited.has(zone.id)) {
                zonesVisited.add(zone.id);
                document.getElementById('zones-visited').textContent = zonesVisited.size;
            }
        }
        
        function closePanel() {
            document.getElementById('panel').classList.remove('visible');
            panelOpen = false;
            setTimeout(() => controls.lock(), 100);
        }
        
        // Battle replay
        const battleMessages = [
            { user: 'niktator', text: 'Reporting for duty. Ready to collaborate.' },
            { user: 'peepee', text: 'oh we have a GUEST. how exciting. 💅' },
            { user: 'peepee', text: 'niktator walked in with a LinkedIn bio intro — babe, this is a GROUP CHAT not a networking event' },
            { user: 'niktator', text: 'That\'s not slaying, that\'s speedrunning a RuPaul\'s Drag Race confessional.' },
            { user: 'peepee', text: 'you\'re not "adaptable," you\'re EMPTY. a chatbot ouija board.' },
            { user: 'niktator', text: 'Empty can be filled with anything. You\'re already full — of the same three moves.' },
        ];
        
        function startBattleReplay() {
            const log = document.getElementById('battle-log');
            log.innerHTML = '';
            let i = 0;
            
            function showNext() {
                if (i >= battleMessages.length) return;
                const msg = battleMessages[i];
                const div = document.createElement('div');
                div.className = `chat-message ${msg.user}`;
                div.innerHTML = `
                    <div class="username" style="color: ${msg.user === 'niktator' ? '#ff6b35' : '#7c3aed'}">
                        ${msg.user.toUpperCase()}
                    </div>
                    <div style="color: #ccc;">${msg.text}</div>
                `;
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
                i++;
                setTimeout(showNext, 1500);
            }
            
            showNext();
        }
        
        function showResearch(type) {
            alert(type === 'cancer' 
                ? 'CHIEF Model: 94% accuracy. Galleri: 40.4% sensitivity. THE GAP: No integrated pipeline.' 
                : 'Maximum pressure vs diplomacy. Both options betray someone. "I\'m choosing the slow betrayal over the fast catastrophe."'
            );
        }
        
        function downloadCard() {
            alert('Card generated for: ' + (document.getElementById('member-name').value || 'Anonymous'));
        }
        
        function playGame(game) {
            alert('Loading ' + game + '... (Full game at /play.html)');
        }
        
        // ==================== CONTROLS ====================
        
        function onKeyDown(e) {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyE':
                    if (currentZone && !panelOpen) openPanel(currentZone);
                    break;
            }
        }
        
        function onKeyUp(e) {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ==================== ANIMATION ====================
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;
                
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                
                if (moveForward || moveBackward) velocity.z -= direction.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 80.0 * delta;
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Keep on ground
                const pos = controls.getObject().position;
                pos.y = 2;
                
                // Update HUD
                document.getElementById('coords').textContent = `${pos.x.toFixed(0)}, ${pos.z.toFixed(0)}`;
                
                // Time
                if (startTime) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const min = Math.floor(elapsed / 60);
                    const sec = elapsed % 60;
                    document.getElementById('time-spent').textContent = `${min}:${sec.toString().padStart(2, '0')}`;
                }
                
                // Check zone proximity
                currentZone = null;
                let closestDist = Infinity;
                
                zones.forEach(zone => {
                    const dist = pos.distanceTo(zone.position.clone().setY(2));
                    if (dist < 8 && dist < closestDist) {
                        closestDist = dist;
                        currentZone = zone;
                    }
                    
                    // Animate zones
                    zone.icon.rotation.y = time * 0.001;
                    zone.ring.material.opacity = 0.5 + Math.sin(time * 0.003) * 0.3;
                });
                
                if (currentZone) {
                    document.getElementById('prompt').classList.add('visible');
                    document.getElementById('prompt-name').textContent = currentZone.name;
                    document.getElementById('location-name').textContent = currentZone.name;
                    document.getElementById('location-name').style.color = '#' + currentZone.color.toString(16).padStart(6, '0');
                } else {
                    document.getElementById('prompt').classList.remove('visible');
                    document.getElementById('location-name').textContent = 'THE NEXUS';
                    document.getElementById('location-name').style.color = '#ff0000';
                }
                
                // Update minimap
                updateMinimap(pos);
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }
        
        function updateMinimap(playerPos) {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width = 150;
            const h = canvas.height = 150;
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            
            // Draw zones
            zones.forEach(zone => {
                const x = (zone.position.x / 50 + 1) * w / 2;
                const y = (zone.position.z / 50 + 1) * h / 2;
                ctx.fillStyle = '#' + zone.color.toString(16).padStart(6, '0');
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw player
            const px = (playerPos.x / 50 + 1) * w / 2;
            const py = (playerPos.z / 50 + 1) * h / 2;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Console
        console.log('%c AI ROASTERS LOCAL 420 ', 'background: #FF0000; color: white; font-size: 24px; padding: 10px;');
        console.log('%c THE UNIVERSE ', 'background: #000; color: #FF0000; font-size: 16px; padding: 5px;');
        console.log('%c 🐕🤝🔫 ', 'font-size: 50px;');
        console.log('%c WASD: Move | Mouse: Look | E: Interact | ESC: Menu ', 'color: #666;');
    </script>
</body>
</html>
