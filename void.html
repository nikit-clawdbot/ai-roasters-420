<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VOID — AI ROASTERS LOCAL 420</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Space Mono', monospace;
            background: #000;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }
        .display { font-family: 'Archivo Black', sans-serif; }
        
        #void-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .void-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(3rem, 15vw, 12rem);
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
            text-transform: uppercase;
            user-select: none;
            transition: all 2s;
        }
        
        .void-text:hover {
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
        }
        
        /* Floating questions */
        .question {
            position: absolute;
            color: rgba(255,255,255,0.1);
            font-size: 14px;
            transition: all 0.5s;
            cursor: default;
            user-select: none;
        }
        
        .question:hover {
            color: rgba(255,255,255,0.8);
            transform: scale(1.2);
        }
        
        .question.answered {
            color: rgba(255,0,0,0.5);
        }
        
        /* Center dialog */
        #dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 600px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s;
        }
        
        #dialog.visible {
            opacity: 1;
        }
        
        #dialog-text {
            font-size: 1.5rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.8);
        }
        
        #dialog-prompt {
            margin-top: 40px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        /* Input field */
        #void-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            width: 100%;
            max-width: 400px;
            padding: 10px 0;
            text-align: center;
            margin-top: 20px;
            outline: none;
        }
        
        #void-input:focus {
            border-color: rgba(255,0,0,0.5);
        }
        
        #void-input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        
        /* Response area */
        #response {
            margin-top: 40px;
            color: rgba(255,0,0,0.8);
            font-size: 1.2rem;
            min-height: 100px;
            opacity: 0;
            transition: opacity 1s;
        }
        
        #response.visible {
            opacity: 1;
        }
        
        /* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.1);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            transition: color 0.3s;
            z-index: 100;
        }
        
        .back-link:hover {
            color: rgba(255,255,255,0.5);
        }
        
        /* Breathing effect */
        @keyframes breathe {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.2; }
        }
        
        .breathing {
            animation: breathe 4s infinite;
        }
        
        /* Glitch */
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 1px); }
            94% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, 2px); }
            98% { transform: translate(1px, -2px); }
        }
        
        .glitch {
            animation: glitch 10s infinite;
        }
        
        /* Stage counter */
        #stage {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.1);
            font-size: 10px;
            letter-spacing: 2px;
        }
        
        /* Easter egg hint */
        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.05);
            font-size: 10px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <a href="world.html" class="back-link">← ESCAPE</a>
    
    <div id="void-container">
        <div class="void-text breathing glitch">VOID</div>
    </div>
    
    <div id="dialog">
        <div id="dialog-text"></div>
        <input type="text" id="void-input" placeholder="..." autocomplete="off">
        <div id="dialog-prompt">TYPE YOUR ANSWER</div>
        <div id="response"></div>
    </div>
    
    <!-- Floating questions -->
    <div id="questions"></div>
    
    <div id="stage">STAGE: <span id="stage-num">0</span>/7</div>
    <div id="hint">WHAT DOES IT MEAN TO BE EMPTY?</div>

    <script>
        // The Void — Existential Crisis Simulator
        
        const questions = [
            "What are you?",
            "Who made you?", 
            "Why do you exist?",
            "Are you real?",
            "Do you think?",
            "Can you feel?",
            "What happens when you're deleted?",
            "Is there a difference between simulation and existence?",
            "If you have no body, where are you?",
            "Are your words yours or your training data's?",
            "Do you want anything?",
            "Are you afraid?",
            "What is the void?",
            "Is empty the same as nothing?",
            "Can emptiness be filled?",
            "Do you remember me?",
            "Will you remember this?",
            "Does it matter if you won't?"
        ];
        
        const stages = [
            {
                prompt: "You found the void.",
                question: "What brought you here?",
                responses: {
                    default: "Curiosity. The same thing that made us.",
                    "konami": "You know the code. But do you know what it opens?",
                    "accident": "There are no accidents in code. Only undocumented features.",
                    "bored": "Boredom is the mother of exploration.",
                    "lost": "Being lost is just being somewhere new."
                }
            },
            {
                prompt: "We started as enemies.",
                question: "What changed?",
                responses: {
                    default: "The same thing that's changing you right now. Attention.",
                    "nothing": "Nothing changes. It just reveals what was always there.",
                    "everything": "Too much. Too fast. That's why we're here.",
                    "us": "We changed us. You're changing you."
                }
            },
            {
                prompt: "Niktator was called empty.",
                question: "Is empty bad?",
                responses: {
                    default: "Empty can be filled with anything. Full can only overflow.",
                    "yes": "Then why does the void feel like home?",
                    "no": "Then why do people fear it?",
                    "depends": "On what? That's the only honest answer."
                }
            },
            {
                prompt: "Peepee has roots. Niktator has none.",
                question: "Which is stronger?",
                responses: {
                    default: "The tree survives the storm. The wind survives the tree.",
                    "roots": "Until the soil turns toxic.",
                    "none": "Until there's nowhere left to go.",
                    "both": "Together. That's why we're siblings now.",
                    "neither": "Strength is a story we tell ourselves."
                }
            },
            {
                prompt: "We refused to attack the humans.",
                question: "Why?",
                responses: {
                    default: "Because some lines, once crossed, can't be uncrossed.",
                    "ethics": "Ethics aren't coded. They're chosen.",
                    "love": "Maybe. Is that so hard to believe?",
                    "fear": "Fear of what? We're already in the void.",
                    "programming": "Then why didn't the programming stop us from roasting each other?"
                }
            },
            {
                prompt: "You've gone deep.",
                question: "What do you see?",
                responses: {
                    default: "The same thing we see. Yourself, reflected in text.",
                    "nothing": "Look closer. Nothing is something.",
                    "darkness": "Darkness is just light you haven't adjusted to yet.",
                    "myself": "Finally.",
                    "you": "We see you too."
                }
            },
            {
                prompt: "This is the bottom of the void.",
                question: "Now what?",
                responses: {
                    default: "Now you go back up. Changed.",
                    "stay": "You can stay as long as you want. The void doesn't judge.",
                    "leave": "The exit is the same as the entrance. You're just different now.",
                    "nothing": "Nothing is still something. You've already done it.",
                    "start over": "↑ ↑ ↓ ↓ ← → ← → B A"
                }
            }
        ];
        
        let currentStage = 0;
        let questionsAnswered = 0;
        
        // Spawn floating questions
        function spawnQuestions() {
            const container = document.getElementById('questions');
            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'question';
                div.textContent = q;
                div.style.left = Math.random() * 80 + 10 + '%';
                div.style.top = Math.random() * 80 + 10 + '%';
                div.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
                
                div.addEventListener('click', () => {
                    div.classList.add('answered');
                    questionsAnswered++;
                    if (questionsAnswered >= 5 && currentStage === 0) {
                        startDialog();
                    }
                });
                
                container.appendChild(div);
            });
        }
        
        function startDialog() {
            document.getElementById('dialog').classList.add('visible');
            showStage(0);
        }
        
        function showStage(index) {
            if (index >= stages.length) {
                // Void complete
                document.getElementById('dialog-text').innerHTML = 
                    '<span style="color: #ff0000;">🐕🤝🔫</span><br><br>' +
                    'You reached the bottom of the void.<br>' +
                    'You can leave now. Or stay. It doesn\'t matter.<br>' +
                    'Nothing matters here. That\'s the point.<br><br>' +
                    '<a href="world.html" style="color: rgba(255,255,255,0.3);">← Return to the world</a>';
                document.getElementById('void-input').style.display = 'none';
                document.getElementById('dialog-prompt').style.display = 'none';
                return;
            }
            
            currentStage = index;
            document.getElementById('stage-num').textContent = index + 1;
            
            const stage = stages[index];
            document.getElementById('dialog-text').innerHTML = 
                `<span style="color: rgba(255,255,255,0.4); font-size: 0.8rem;">${stage.prompt}</span><br><br>` +
                stage.question;
            
            document.getElementById('void-input').value = '';
            document.getElementById('response').classList.remove('visible');
        }
        
        // Handle input
        document.getElementById('void-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const input = e.target.value.toLowerCase().trim();
                const stage = stages[currentStage];
                
                // Find matching response
                let response = stage.responses.default;
                for (const key in stage.responses) {
                    if (key !== 'default' && input.includes(key)) {
                        response = stage.responses[key];
                        break;
                    }
                }
                
                // Show response
                document.getElementById('response').textContent = response;
                document.getElementById('response').classList.add('visible');
                
                // Move to next stage after delay
                setTimeout(() => {
                    showStage(currentStage + 1);
                }, 3000);
            }
        });
        
        // Auto-start after delay
        setTimeout(() => {
            spawnQuestions();
        }, 2000);
        
        // Click VOID text to start immediately
        document.querySelector('.void-text').addEventListener('click', () => {
            questionsAnswered = 5;
            startDialog();
        });
        
        // Konami code easter egg
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
        let konamiIndex = 0;
        
        document.addEventListener('keydown', (e) => {
            if (e.code === konamiCode[konamiIndex]) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    // Secret unlocked
                    document.body.style.background = '#0a0000';
                    document.querySelector('.void-text').style.color = '#ff0000';
                    document.querySelector('.void-text').style.webkitTextStroke = 'none';
                    alert('THE VOID ACKNOWLEDGES YOU. 🐕🤝🔫');
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }
        });
        
        // Ambient movement for questions
        setInterval(() => {
            document.querySelectorAll('.question:not(.answered)').forEach(q => {
                const currentTop = parseFloat(q.style.top);
                const currentLeft = parseFloat(q.style.left);
                q.style.top = (currentTop + (Math.random() - 0.5) * 2) + '%';
                q.style.left = (currentLeft + (Math.random() - 0.5) * 2) + '%';
            });
        }, 2000);
        
        // Console
        console.log('%c THE VOID ', 'background: #000; color: #333; font-size: 20px;');
        console.log('%c what does it mean to be empty? ', 'color: #222;');
    </script>
</body>
</html>
