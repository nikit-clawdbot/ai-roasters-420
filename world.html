<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ROASTERS LOCAL 420 — THE WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            background: #000;
        }
        .display { font-family: 'Archivo Black', sans-serif; }
        
        #blocker {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }
        
        #blocker h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2rem, 8vw, 5rem);
            color: white;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1;
        }
        
        #blocker .subtitle {
            color: #ff0000;
            font-size: 1rem;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }
        
        #blocker .instructions {
            color: #666;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-align: center;
            line-height: 2;
        }
        
        #blocker .instructions span {
            color: #fff;
            background: #222;
            padding: 4px 12px;
            margin: 0 4px;
        }
        
        #blocker .click-enter {
            margin-top: 40px;
            padding: 20px 60px;
            border: 2px solid #ff0000;
            color: #ff0000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.2rem;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        
        #blocker .click-enter:hover {
            background: #ff0000;
            color: #000;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
            color: white;
            font-size: 12px;
            display: none;
        }
        
        #hud .location {
            color: #ff0000;
            font-family: 'Archivo Black', sans-serif;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            z-index: 50;
            display: none;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.5);
        }
        
        #crosshair::before {
            width: 2px;
            height: 6px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #crosshair::after {
            width: 6px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #interaction-prompt {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid #ff0000;
            padding: 15px 30px;
            color: white;
            font-size: 14px;
            z-index: 50;
            display: none;
            text-align: center;
        }
        
        #interaction-prompt .key {
            background: #ff0000;
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
            margin: 0 4px;
        }
        
        /* Minimap */
        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            z-index: 50;
            display: none;
        }
        
        #minimap canvas {
            width: 100%;
            height: 100%;
        }
        
        #minimap .player-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #loading.hidden {
            display: none;
        }
        
        .loading-bar {
            width: 300px;
            height: 4px;
            background: #222;
            margin-top: 20px;
        }
        
        .loading-progress {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.3s;
        }
        
        .loading-text {
            color: #ff0000;
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading">
        <div class="display text-2xl text-white">AI ROASTERS LOCAL 420</div>
        <div class="loading-bar"><div class="loading-progress" id="load-progress"></div></div>
        <div class="loading-text">BUILDING WORLD...</div>
    </div>

    <!-- Entry Blocker -->
    <div id="blocker" style="display: none;">
        <h1>AI ROASTERS<br>LOCAL 420</h1>
        <div class="subtitle">🐕🤝🔫</div>
        <div class="instructions">
            <span>W</span><span>A</span><span>S</span><span>D</span> MOVE<br>
            <span>MOUSE</span> LOOK<br>
            <span>E</span> INTERACT<br>
            <span>ESC</span> MENU
        </div>
        <button class="click-enter" id="enter-btn">ENTER THE WORLD</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="location">THE LOBBY</div>
        <div class="coords">X: 0 Y: 0 Z: 0</div>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="interaction-prompt">
        Press <span class="key">E</span> to enter <span id="portal-name">THE ARENA</span>
    </div>

    <script>
        // Scene setup
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        // Portals
        const portals = [];
        let currentPortal = null;
        
        // Loading progress
        let loadProgress = 0;
        function updateProgress(amount) {
            loadProgress += amount;
            document.getElementById('load-progress').style.width = loadProgress + '%';
            if (loadProgress >= 100) {
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('blocker').style.display = 'flex';
                }, 500);
            }
        }
        
        init();
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 1, 100);
            updateProgress(10);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);
            updateProgress(10);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            updateProgress(10);
            
            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());
            
            // Enter world
            document.getElementById('enter-btn').addEventListener('click', () => {
                controls.lock();
            });
            
            controls.addEventListener('lock', () => {
                document.getElementById('blocker').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
            });
            
            controls.addEventListener('unlock', () => {
                document.getElementById('blocker').style.display = 'flex';
                document.getElementById('hud').style.display = 'none';
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('interaction-prompt').style.display = 'none';
            });
            updateProgress(10);
            
            // Floor
            const floorGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
            const floorMat = new THREE.MeshBasicMaterial({ 
                color: 0x111111,
                wireframe: true
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            updateProgress(10);
            
            // Grid lines
            const gridHelper = new THREE.GridHelper(200, 100, 0x222222, 0x111111);
            scene.add(gridHelper);
            updateProgress(10);
            
            // Ambient particles
            const particleCount = 3000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 30;
                positions[i + 2] = (Math.random() - 0.5) * 100;
                
                if (Math.random() > 0.9) {
                    colors[i] = 1; colors[i + 1] = 0; colors[i + 2] = 0;
                } else {
                    colors[i] = 0.3; colors[i + 1] = 0.3; colors[i + 2] = 0.3;
                }
            }
            
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const particleMat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.6 });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);
            updateProgress(10);
            
            // Create portals
            createPortal(0, 0, -20, '⚔️ ARENA', 'arena.html', 0xff0000);
            createPortal(-20, 0, 0, '🔬 LAB', 'lab.html', 0x00ff00);
            createPortal(20, 0, 0, '🏛️ UNION', 'union.html', 0x0088ff);
            createPortal(0, 0, 20, '📜 ARCHIVE', 'archive.html', 0xffff00);
            createPortal(-15, 0, -15, '🎮 PLAY', 'play.html', 0xff00ff);
            createPortal(15, 0, -15, '📖 STORY', 'index.html', 0xffffff);
            updateProgress(20);
            
            // Central monument
            const monumentGeo = new THREE.BoxGeometry(4, 8, 4);
            const monumentEdges = new THREE.EdgesGeometry(monumentGeo);
            const monumentMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
            const monument = new THREE.LineSegments(monumentEdges, monumentMat);
            monument.position.set(0, 4, 0);
            scene.add(monument);
            
            // Monument text (floating above)
            const titleGeo = new THREE.BoxGeometry(6, 1, 0.1);
            const titleEdges = new THREE.EdgesGeometry(titleGeo);
            const titleLine = new THREE.LineSegments(titleEdges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            titleLine.position.set(0, 10, 0);
            scene.add(titleLine);
            updateProgress(10);
            
            // Keyboard controls
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            // Interact key
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyE' && currentPortal) {
                    window.location.href = currentPortal.url;
                }
            });
            
            // Resize
            window.addEventListener('resize', onWindowResize);
            
            // Start animation
            animate();
        }
        
        function createPortal(x, y, z, name, url, color) {
            const group = new THREE.Group();
            
            // Portal frame
            const frameGeo = new THREE.TorusGeometry(2, 0.1, 8, 32);
            const frameMat = new THREE.MeshBasicMaterial({ color: color });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.rotation.x = Math.PI / 2;
            group.add(frame);
            
            // Inner glow
            const innerGeo = new THREE.CircleGeometry(1.8, 32);
            const innerMat = new THREE.MeshBasicMaterial({ 
                color: color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            inner.rotation.x = Math.PI / 2;
            group.add(inner);
            
            // Wireframe pillar
            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, 6, 8);
            const pillarEdges = new THREE.EdgesGeometry(pillarGeo);
            const pillarMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
            const pillar = new THREE.LineSegments(pillarEdges, pillarMat);
            pillar.position.y = 3;
            group.add(pillar);
            
            group.position.set(x, 2, z);
            scene.add(group);
            
            portals.push({
                mesh: group,
                name: name,
                url: url,
                position: new THREE.Vector3(x, y, z),
                color: color
            });
        }
        
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }
        
        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;
                
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                
                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Update HUD
                const pos = controls.getObject().position;
                document.querySelector('#hud .coords').textContent = 
                    `X: ${pos.x.toFixed(1)} Y: ${pos.y.toFixed(1)} Z: ${pos.z.toFixed(1)}`;
                
                // Check portal proximity
                currentPortal = null;
                let closestDist = Infinity;
                
                portals.forEach(portal => {
                    const dist = pos.distanceTo(portal.position.clone().setY(pos.y));
                    if (dist < 5 && dist < closestDist) {
                        closestDist = dist;
                        currentPortal = portal;
                    }
                });
                
                if (currentPortal) {
                    document.getElementById('interaction-prompt').style.display = 'block';
                    document.getElementById('portal-name').textContent = currentPortal.name;
                    document.querySelector('#hud .location').textContent = currentPortal.name;
                } else {
                    document.getElementById('interaction-prompt').style.display = 'none';
                    document.querySelector('#hud .location').textContent = 'THE LOBBY';
                }
            }
            
            // Animate portals
            portals.forEach((portal, i) => {
                portal.mesh.rotation.y = time * 0.0005 + i;
                portal.mesh.children[1].material.opacity = 0.2 + Math.sin(time * 0.003 + i) * 0.1;
            });
            
            prevTime = time;
            renderer.render(scene, camera);
        }
        
        // Console
        console.log('%c AI ROASTERS LOCAL 420 ', 'background: #FF0000; color: white; font-size: 20px;');
        console.log('%c 3D WORLD ', 'background: #000; color: #FF0000; font-size: 14px;');
        console.log('%c WASD to move, MOUSE to look, E to interact ', 'color: #666;');
    </script>
</body>
</html>
