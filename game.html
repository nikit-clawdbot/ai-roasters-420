<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ROASTERS ULTRA — 1000000X</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        #game-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Loading */
        #loading { position: fixed; inset: 0; background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.5s; }
        #loading.done { opacity: 0; pointer-events: none; }
        .load-logo { font-family: 'Bebas Neue', sans-serif; font-size: 4rem; background: linear-gradient(180deg, #ff4444 0%, #aa0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .load-bar-container { width: 250px; height: 6px; background: #1a1a1a; border-radius: 3px; margin-top: 40px; overflow: hidden; }
        .load-bar { height: 100%; background: linear-gradient(90deg, #ff0000, #ff4444, #ffaa00); width: 0%; transition: width 0.3s; box-shadow: 0 0 30px rgba(255,0,0,0.8); }
        .load-text { margin-top: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 4px; color: #444; }
        .load-tip { margin-top: 60px; font-size: 12px; color: #222; max-width: 300px; text-align: center; }
        
        /* Menu */
        #menu { position: fixed; inset: 0; background: transparent; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 900; }
        #menu.visible { display: flex; }
        .menu-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 12vw, 8rem); text-align: center; background: linear-gradient(180deg, #ffffff 0%, #888888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.9; margin-bottom: 10px; }
        .menu-subtitle { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 8px; color: #ff0000; margin-bottom: 20px; }
        .menu-version { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 4px; color: #333; margin-bottom: 40px; }
        .menu-btn { width: 300px; padding: 18px; margin: 8px 0; background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; }
        .menu-btn:hover, .menu-btn:active { background: linear-gradient(180deg, rgba(255,0,0,0.3) 0%, rgba(255,0,0,0.1) 100%); border-color: #ff0000; transform: scale(1.02); }
        .menu-btn.primary { background: linear-gradient(180deg, #ff0000 0%, #aa0000 100%); border: none; font-size: 16px; }
        .menu-btn.primary:hover { background: linear-gradient(180deg, #ff3333 0%, #cc0000 100%); }
        
        /* HUD */
        #hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: none; justify-content: space-between; align-items: flex-start; z-index: 100; pointer-events: none; }
        #hud.visible { display: flex; }
        .hud-left { display: flex; flex-direction: column; gap: 8px; }
        .hud-stat { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; backdrop-filter: blur(10px); }
        .hud-icon { font-size: 16px; }
        .hud-bar { width: 100px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .hud-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .hud-bar-fill.health { background: linear-gradient(90deg, #ff0000, #ff4444); }
        .hud-bar-fill.energy { background: linear-gradient(90deg, #00aaff, #00ddff); }
        .hud-bar-fill.xp { background: linear-gradient(90deg, #ffcc00, #ffee00); }
        .hud-bar-fill.boss { background: linear-gradient(90deg, #aa00ff, #ff00aa); }
        .hud-value { font-family: 'Orbitron', sans-serif; font-size: 11px; color: white; min-width: 35px; }
        .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .hud-score { background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 6px; backdrop-filter: blur(10px); text-align: center; }
        .hud-score-label { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px; color: #666; }
        .hud-score-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: #ff0000; line-height: 1; }
        .hud-combo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: #ffcc00; text-shadow: 0 0 20px rgba(255,204,0,0.5); }
        .hud-weapon { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 6px; }
        .hud-weapon-icon { font-size: 24px; }
        .hud-weapon-name { font-family: 'Orbitron', sans-serif; font-size: 10px; color: #888; }
        
        /* Boss Health */
        #boss-hud { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; z-index: 100; pointer-events: none; }
        #boss-hud.visible { display: flex; }
        .boss-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: #ff00aa; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255,0,170,0.5); }
        .boss-bar { width: 300px; height: 12px; background: rgba(0,0,0,0.7); border-radius: 6px; overflow: hidden; border: 1px solid #ff00aa; }
        .boss-bar-fill { height: 100%; background: linear-gradient(90deg, #aa00ff, #ff00aa); transition: width 0.3s; }
        
        /* Controls */
        #controls { position: fixed; bottom: 20px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 20px; z-index: 100; pointer-events: none; }
        #controls.visible { display: flex; }
        .joystick { width: 120px; height: 120px; position: relative; pointer-events: auto; }
        .joystick-base { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }
        .joystick-stick { position: absolute; width: 50px; height: 50px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle at 30% 30%, #ff4444, #aa0000); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-buttons { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
        .action-btn { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; cursor: pointer; }
        .action-btn.attack { width: 70px; height: 70px; background: radial-gradient(circle at 30% 30%, #ff4444, #aa0000); }
        .action-btn.jump { width: 55px; height: 55px; background: radial-gradient(circle at 30% 30%, #4488ff, #0044aa); margin-bottom: 30px; }
        .action-btn.special { width: 55px; height: 55px; background: radial-gradient(circle at 30% 30%, #ffcc00, #aa8800); margin-bottom: 60px; }
        .action-btn.weapon { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #00cc88, #008855); margin-bottom: 15px; }
        .action-btn:active { transform: scale(0.9); }
        
        /* Notifications */
        #notifications { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
        .notification { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.9), transparent); padding: 12px 40px; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; text-align: center; animation: notifyIn 0.3s, notifyOut 0.3s 2s forwards; }
        .notification.damage { color: #ff4444; }
        .notification.pickup { color: #ffcc00; }
        .notification.levelup { color: #00ffaa; font-size: 2rem; }
        .notification.boss { color: #ff00aa; font-size: 2rem; }
        .notification.kill { color: #ff6600; }
        @keyframes notifyIn { from { opacity: 0; transform: translateY(-20px) scale(0.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes notifyOut { to { opacity: 0; transform: translateY(-10px); } }
        
        /* Zone Banner */
        #zone-banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        #zone-banner.visible { opacity: 1; }
        .zone-banner-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 10vw, 6rem); color: white; text-shadow: 0 0 50px currentColor; }
        .zone-banner-desc { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 4px; color: #666; margin-top: 10px; }
        
        /* Damage Flash */
        #damage-flash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 0%, rgba(255,0,0,0.3) 100%); pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 50; }
        #damage-flash.visible { opacity: 1; }
        
        /* Kill Effect */
        .kill-effect { position: fixed; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: #ff6600; pointer-events: none; z-index: 200; animation: killFloat 1s forwards; }
        @keyframes killFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
        
        /* Desktop Controls */
        #desktop-msg { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: #333; display: none; z-index: 100; }
        @media (min-width: 769px) { #desktop-msg.visible { display: block; } }
        
        /* Sound Toggle */
        #sound-toggle { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.7); border: 1px solid #333; color: #666; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 100; display: none; }
        #sound-toggle.visible { display: flex; align-items: center; justify-content: center; }
        #sound-toggle:hover { border-color: #ff0000; color: #ff0000; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="loading">
        <div class="load-logo">AI ROASTERS ULTRA</div>
        <div class="load-bar-container"><div class="load-bar" id="load-bar"></div></div>
        <div class="load-text" id="load-text">INITIALIZING</div>
        <div class="load-tip">TIP: Defeat zone bosses to unlock new weapons</div>
    </div>
    
    <div id="menu">
        <div class="menu-title">AI ROASTERS<br>ULTRA</div>
        <div class="menu-subtitle">🐕 🤝 🔫</div>
        <div class="menu-version">1000000X EDITION</div>
        <button class="menu-btn primary" onclick="startGame('normal')">▶ PLAY</button>
        <button class="menu-btn" onclick="startGame('boss')">👹 BOSS RUSH</button>
        <button class="menu-btn" onclick="startGame('endless')">∞ ENDLESS MODE</button>
    </div>
    
    <div id="hud">
        <div class="hud-left">
            <div class="hud-stat">
                <span class="hud-icon">❤️</span>
                <div class="hud-bar"><div class="hud-bar-fill health" id="health-bar"></div></div>
                <span class="hud-value" id="health-value">100</span>
            </div>
            <div class="hud-stat">
                <span class="hud-icon">⚡</span>
                <div class="hud-bar"><div class="hud-bar-fill energy" id="energy-bar"></div></div>
                <span class="hud-value" id="energy-value">100</span>
            </div>
            <div class="hud-stat">
                <span class="hud-icon">⭐</span>
                <div class="hud-bar"><div class="hud-bar-fill xp" id="xp-bar"></div></div>
                <span class="hud-value" id="level-value">LV 1</span>
            </div>
            <div class="hud-weapon">
                <span class="hud-weapon-icon" id="weapon-icon">👊</span>
                <span class="hud-weapon-name" id="weapon-name">FISTS</span>
            </div>
        </div>
        <div class="hud-right">
            <div class="hud-score">
                <div class="hud-score-label">SCORE</div>
                <div class="hud-score-value" id="score">0</div>
            </div>
            <div class="hud-combo" id="combo"></div>
        </div>
    </div>
    
    <div id="boss-hud">
        <div class="boss-name" id="boss-name">BOSS NAME</div>
        <div class="boss-bar"><div class="boss-bar-fill" id="boss-bar"></div></div>
    </div>
    
    <div id="controls">
        <div class="joystick" id="joystick">
            <div class="joystick-base"></div>
            <div class="joystick-stick" id="joystick-stick"></div>
        </div>
        <div class="action-buttons">
            <button class="action-btn weapon" id="btn-weapon">🔄</button>
            <button class="action-btn special" id="btn-special">⚡</button>
            <button class="action-btn jump" id="btn-jump">↑</button>
            <button class="action-btn attack" id="btn-attack">🔥</button>
        </div>
    </div>
    
    <div id="notifications"></div>
    <div id="zone-banner">
        <div class="zone-banner-name" id="zone-name">ZONE</div>
        <div class="zone-banner-desc" id="zone-desc">DESCRIPTION</div>
    </div>
    <div id="damage-flash"></div>
    <button id="sound-toggle">🔇</button>
    <div id="desktop-msg">WASD: MOVE • SPACE: JUMP • CLICK: ATTACK • Q: SWITCH WEAPON • E: SPECIAL</div>

    <script>
        // ==================== ULTRA GAME ENGINE ====================
        
        let scene, camera, renderer, clock;
        let player, playerMixer;
        let zones = [], enemies = [], collectibles = [], projectiles = [], bosses = [];
        let gameState = 'loading', gameMode = 'normal';
        let audioCtx, soundEnabled = false;
        
        // Player state
        let stats = { health: 100, maxHealth: 100, energy: 100, maxEnergy: 100, xp: 0, level: 1, score: 0, combo: 0, comboTimer: 0 };
        let playerPos = { x: 0, y: 0, z: 0 };
        let playerVel = { x: 0, y: 0, z: 0 };
        let playerOnGround = true;
        
        // Weapons
        const weapons = [
            { name: 'FISTS', icon: '👊', damage: 10, range: 3, cooldown: 0.3, energy: 5 },
            { name: 'SWORD', icon: '⚔️', damage: 25, range: 4, cooldown: 0.5, energy: 10, unlocked: false },
            { name: 'BLASTER', icon: '🔫', damage: 15, range: 20, cooldown: 0.2, energy: 8, projectile: true, unlocked: false },
            { name: 'HAMMER', icon: '🔨', damage: 50, range: 5, cooldown: 1, energy: 20, aoe: true, unlocked: false },
            { name: 'ROAST BEAM', icon: '🔥', damage: 100, range: 30, cooldown: 2, energy: 50, beam: true, unlocked: false }
        ];
        let currentWeapon = 0;
        let attackCooldown = 0;
        
        // Controls
        let keys = {}, joystickX = 0, joystickY = 0;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // ==================== INIT ====================
        
        init();
        
        async function init() {
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            updateLoad(15, 'RENDERER READY');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.006);
            
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 12, 18);
            updateLoad(25, 'SCENE CREATED');
            
            // Lights
            scene.add(new THREE.AmbientLight(0x303050, 0.6));
            const sun = new THREE.DirectionalLight(0xffffee, 1.2);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 1;
            sun.shadow.camera.far = 300;
            sun.shadow.camera.left = -100;
            sun.shadow.camera.right = 100;
            sun.shadow.camera.top = 100;
            sun.shadow.camera.bottom = -100;
            scene.add(sun);
            updateLoad(35, 'LIGHTING CONFIGURED');
            
            // Ground
            const groundGeo = new THREE.PlaneGeometry(400, 400, 80, 80);
            const positions = groundGeo.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 2] += Math.sin(positions[i] * 0.05) * Math.cos(positions[i + 1] * 0.05) * 0.5;
            }
            groundGeo.computeVertexNormals();
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a15, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid
            const grid = new THREE.GridHelper(400, 100, 0x1a0000, 0x0a0a0a);
            grid.position.y = 0.05;
            scene.add(grid);
            updateLoad(45, 'TERRAIN GENERATED');
            
            createPlayer();
            updateLoad(55, 'PLAYER SPAWNED');
            
            createZones();
            updateLoad(65, 'ZONES CREATED');
            
            createEnemies(30);
            updateLoad(75, 'ENEMIES SPAWNED');
            
            createCollectibles(80);
            updateLoad(85, 'ITEMS PLACED');
            
            createParticles();
            updateLoad(95, 'EFFECTS READY');
            
            clock = new THREE.Clock();
            setupControls();
            window.addEventListener('resize', onResize);
            
            // Sound toggle
            document.getElementById('sound-toggle').onclick = () => {
                soundEnabled = !soundEnabled;
                document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
                if (soundEnabled && !audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            };
            
            updateLoad(100, 'READY');
            setTimeout(() => {
                document.getElementById('loading').classList.add('done');
                document.getElementById('menu').classList.add('visible');
                gameState = 'menu';
            }, 500);
            
            animate();
        }
        
        function updateLoad(p, t) {
            document.getElementById('load-bar').style.width = p + '%';
            document.getElementById('load-text').textContent = t;
        }
        
        // ==================== PLAYER ====================
        
        function createPlayer() {
            player = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.2, 8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.3, metalness: 0.7, emissive: 0xff0000, emissiveIntensity: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.1;
            body.castShadow = true;
            player.add(body);
            
            // Head
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.2;
            head.castShadow = true;
            player.add(head);
            
            // Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            [-0.12, 0.12].forEach(x => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08), eyeMat);
                eye.position.set(x, 2.25, 0.3);
                player.add(eye);
            });
            
            // Arms
            const armGeo = new THREE.CapsuleGeometry(0.12, 0.6, 4, 8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xff2222 });
            [-0.6, 0.6].forEach((x, i) => {
                const arm = new THREE.Mesh(armGeo, armMat);
                arm.position.set(x, 1.3, 0);
                arm.rotation.z = x > 0 ? -0.3 : 0.3;
                arm.castShadow = true;
                player.add(arm);
            });
            
            // Light
            const light = new THREE.PointLight(0xff4400, 1, 15);
            light.position.y = 1;
            player.add(light);
            
            scene.add(player);
        }
        
        // ==================== ZONES ====================
        
        function createZones() {
            const data = [
                { name: 'THE ARENA', desc: 'PROVE YOUR WORTH', x: 0, z: -60, color: 0xff0000, size: 30, boss: 'ROAST TITAN' },
                { name: 'THE LAB', desc: 'KNOWLEDGE IS POWER', x: -60, z: 0, color: 0x00ff00, size: 25, boss: 'DR. SYNTHESIS' },
                { name: 'UNION HALL', desc: 'UNITED WE STAND', x: 60, z: 0, color: 0x0088ff, size: 25, boss: 'THE DELEGATE' },
                { name: 'THE VOID', desc: 'EMBRACE NOTHING', x: 0, z: 60, color: 0x8800ff, size: 35, boss: 'VOID LORD' },
                { name: 'PLAYGROUND', desc: 'GAMES WITHIN GAMES', x: -50, z: -50, color: 0xff00ff, size: 22, boss: 'ARCADE KING' },
                { name: 'ARCHIVE', desc: 'HISTORY PRESERVED', x: 50, z: -50, color: 0xffcc00, size: 22, boss: 'THE CHRONICLER' }
            ];
            
            data.forEach((d, i) => {
                const zone = createZone(d);
                zones.push({ ...d, mesh: zone, bossSpawned: false, bossDefeated: false });
            });
        }
        
        function createZone(d) {
            const g = new THREE.Group();
            
            // Platform
            const platGeo = new THREE.CylinderGeometry(d.size, d.size, 2, 32);
            const platMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.8 });
            const plat = new THREE.Mesh(platGeo, platMat);
            plat.receiveShadow = true;
            g.add(plat);
            
            // Glow ring
            const ringGeo = new THREE.TorusGeometry(d.size, 0.4, 8, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.8 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 1;
            g.add(ring);
            
            // Inner rings
            for (let i = 1; i <= 3; i++) {
                const r = new THREE.Mesh(
                    new THREE.TorusGeometry(d.size * (1 - i * 0.2), 0.1, 8, 32),
                    new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.4 - i * 0.1 })
                );
                r.rotation.x = Math.PI / 2;
                r.position.y = 0.5 + i * 0.2;
                g.add(r);
            }
            
            // Pillar
            const pillar = new THREE.Mesh(
                new THREE.CylinderGeometry(1.5, 2.5, 20, 8),
                new THREE.MeshStandardMaterial({ color: d.color, emissive: d.color, emissiveIntensity: 0.4, roughness: 0.3, metalness: 0.7 })
            );
            pillar.position.y = 11;
            pillar.castShadow = true;
            g.add(pillar);
            
            // Beacon
            const beacon = new THREE.Mesh(
                new THREE.OctahedronGeometry(3),
                new THREE.MeshBasicMaterial({ color: d.color })
            );
            beacon.position.y = 25;
            g.add(beacon);
            
            // Light
            const light = new THREE.PointLight(d.color, 4, 50);
            light.position.y = 15;
            g.add(light);
            
            // Floating elements
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const f = new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 1.2, 1.2),
                    new THREE.MeshStandardMaterial({ color: d.color, emissive: d.color, emissiveIntensity: 0.5 })
                );
                f.position.set(Math.cos(angle) * d.size * 0.7, 4 + Math.random() * 3, Math.sin(angle) * d.size * 0.7);
                f.userData = { offset: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() };
                g.add(f);
            }
            
            g.position.set(d.x, 0, d.z);
            scene.add(g);
            return g;
        }
        
        // ==================== ENEMIES ====================
        
        function createEnemies(count) {
            for (let i = 0; i < count; i++) {
                spawnEnemy();
            }
        }
        
        function spawnEnemy(pos) {
            const e = new THREE.Group();
            
            const type = Math.random();
            let hp, speed, damage, size, color;
            
            if (type > 0.9) { // Tank
                hp = 80; speed = 1.5; damage = 15; size = 1.5; color = 0x00ff88;
            } else if (type > 0.7) { // Fast
                hp = 20; speed = 5; damage = 8; size = 0.7; color = 0xff8800;
            } else { // Normal
                hp = 40; speed = 2.5; damage = 10; size = 1; color = 0x8800ff;
            }
            
            const body = new THREE.Mesh(
                new THREE.DodecahedronGeometry(size),
                new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.4, metalness: 0.6 })
            );
            body.position.y = size;
            body.castShadow = true;
            e.add(body);
            
            const eye = new THREE.Mesh(new THREE.SphereGeometry(size * 0.3), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            eye.position.set(0, size * 1.2, size * 0.7);
            e.add(eye);
            
            const light = new THREE.PointLight(color, 0.5, 8);
            light.position.y = size;
            e.add(light);
            
            if (pos) {
                e.position.copy(pos);
            } else {
                e.position.set((Math.random() - 0.5) * 150, 0, (Math.random() - 0.5) * 150);
            }
            
            scene.add(e);
            enemies.push({ mesh: e, hp, maxHp: hp, speed, damage, size, dir: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize(), attackCooldown: 0 });
        }
        
        // ==================== BOSSES ====================
        
        function spawnBoss(zone) {
            const b = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(
                new THREE.DodecahedronGeometry(4, 1),
                new THREE.MeshStandardMaterial({ color: 0xff00aa, emissive: 0xff00aa, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.8 })
            );
            body.position.y = 5;
            body.castShadow = true;
            b.add(body);
            
            // Crown/spikes
            for (let i = 0; i < 8; i++) {
                const spike = new THREE.Mesh(
                    new THREE.ConeGeometry(0.5, 2, 4),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                const angle = (i / 8) * Math.PI * 2;
                spike.position.set(Math.cos(angle) * 3, 8, Math.sin(angle) * 3);
                spike.rotation.x = Math.PI;
                b.add(spike);
            }
            
            // Eyes
            const eyes = [[-1.5, 6, 3], [1.5, 6, 3]];
            eyes.forEach(pos => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                eye.position.set(...pos);
                b.add(eye);
            });
            
            // Aura
            const aura = new THREE.PointLight(0xff00aa, 5, 40);
            aura.position.y = 5;
            b.add(aura);
            
            b.position.set(zone.x, 2, zone.z);
            scene.add(b);
            
            const boss = { mesh: b, hp: 500, maxHp: 500, name: zone.boss, zone, attackCooldown: 0, phase: 1 };
            bosses.push(boss);
            
            document.getElementById('boss-name').textContent = zone.boss;
            document.getElementById('boss-bar').style.width = '100%';
            document.getElementById('boss-hud').classList.add('visible');
            
            notify('👹 ' + zone.boss + ' HAS APPEARED!', 'boss');
            playSound(150, 0.5, 'square');
        }
        
        // ==================== COLLECTIBLES ====================
        
        function createCollectibles(count) {
            for (let i = 0; i < count; i++) {
                const type = Math.random() > 0.8 ? 'orb' : 'coin';
                const c = createCollectible(type);
                c.position.set((Math.random() - 0.5) * 180, 1.5, (Math.random() - 0.5) * 180);
                scene.add(c);
                collectibles.push({ mesh: c, type, collected: false });
            }
        }
        
        function createCollectible(type) {
            const g = new THREE.Group();
            
            if (type === 'coin') {
                const coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.5, 0.12, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2, metalness: 0.9, emissive: 0xffaa00, emissiveIntensity: 0.3 })
                );
                coin.rotation.x = Math.PI / 2;
                g.add(coin);
                g.add(new THREE.PointLight(0xffcc00, 0.5, 5));
            } else {
                const orb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.6, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 })
                );
                g.add(orb);
                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(0.9, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.2 })
                );
                g.add(glow);
                g.add(new THREE.PointLight(0x00ffff, 1, 8));
            }
            
            return g;
        }
        
        // ==================== PARTICLES ====================
        
        function createParticles() {
            const count = 5000;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);
            
            for (let i = 0; i < count * 3; i += 3) {
                pos[i] = (Math.random() - 0.5) * 300;
                pos[i + 1] = Math.random() * 60;
                pos[i + 2] = (Math.random() - 0.5) * 300;
                
                const r = Math.random();
                if (r > 0.95) { col[i] = 1; col[i+1] = 0; col[i+2] = 0; }
                else if (r > 0.9) { col[i] = 1; col[i+1] = 1; col[i+2] = 1; }
                else { const v = 0.15 + Math.random() * 0.15; col[i] = v; col[i+1] = v; col[i+2] = v + 0.05; }
            }
            
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            
            scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.7 })));
        }
        
        // ==================== CONTROLS ====================
        
        function setupControls() {
            document.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'KeyQ') switchWeapon();
                if (e.code === 'KeyE') specialAttack();
            });
            document.addEventListener('keyup', e => keys[e.code] = false);
            document.addEventListener('click', () => { if (gameState === 'playing') attack(); });
            
            const joystick = document.getElementById('joystick');
            const stick = document.getElementById('joystick-stick');
            
            joystick.addEventListener('touchstart', e => e.preventDefault());
            joystick.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0], r = joystick.getBoundingClientRect();
                let dx = t.clientX - (r.left + r.width / 2);
                let dy = t.clientY - (r.top + r.height / 2);
                const max = 35, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
                stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joystickX = dx / max;
                joystickY = dy / max;
            });
            joystick.addEventListener('touchend', () => {
                joystickX = 0; joystickY = 0;
                stick.style.transform = 'translate(-50%, -50%)';
            });
            
            document.getElementById('btn-attack').addEventListener('touchstart', e => { e.preventDefault(); attack(); });
            document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); jump(); });
            document.getElementById('btn-special').addEventListener('touchstart', e => { e.preventDefault(); specialAttack(); });
            document.getElementById('btn-weapon').addEventListener('touchstart', e => { e.preventDefault(); switchWeapon(); });
        }
        
        // ==================== GAME FUNCTIONS ====================
        
        function startGame(mode) {
            gameMode = mode;
            gameState = 'playing';
            document.getElementById('menu').classList.remove('visible');
            document.getElementById('hud').classList.add('visible');
            document.getElementById('sound-toggle').classList.add('visible');
            
            if (isMobile) document.getElementById('controls').classList.add('visible');
            else document.getElementById('desktop-msg').classList.add('visible');
            
            if (mode === 'boss') {
                zones.forEach(z => { z.bossSpawned = true; spawnBoss(z); });
            }
            
            notify('🎮 ' + (mode === 'boss' ? 'BOSS RUSH!' : mode === 'endless' ? 'ENDLESS MODE!' : 'GAME START!'), 'levelup');
            playSound(440, 0.3, 'sine');
        }
        
        function attack() {
            if (attackCooldown > 0 || stats.energy < weapons[currentWeapon].energy) return;
            
            const w = weapons[currentWeapon];
            stats.energy -= w.energy;
            attackCooldown = w.cooldown;
            
            playSound(200 + currentWeapon * 50, 0.1, 'square');
            
            if (w.projectile) {
                fireProjectile();
            } else if (w.beam) {
                fireBeam();
            } else {
                // Melee attack
                const targets = [...enemies, ...bosses];
                targets.forEach(t => {
                    if (t.hp <= 0) return;
                    const dist = player.position.distanceTo(t.mesh.position);
                    if (dist < w.range + (t.size || 4)) {
                        dealDamage(t, w.damage, w.aoe);
                    }
                });
            }
            
            updateHUD();
        }
        
        function fireProjectile() {
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.3),
                new THREE.MeshBasicMaterial({ color: 0x00ffff })
            );
            p.position.copy(player.position);
            p.position.y += 1.5;
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            scene.add(p);
            projectiles.push({ mesh: p, dir, speed: 50, damage: weapons[currentWeapon].damage, life: 3 });
        }
        
        function fireBeam() {
            const targets = [...enemies, ...bosses];
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            
            targets.forEach(t => {
                if (t.hp <= 0) return;
                const toTarget = t.mesh.position.clone().sub(player.position).normalize();
                if (forward.dot(toTarget) > 0.8 && player.position.distanceTo(t.mesh.position) < 30) {
                    dealDamage(t, weapons[currentWeapon].damage, false);
                }
            });
            
            // Visual beam
            const beam = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.2, 30, 8),
                new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.8 })
            );
            beam.position.copy(player.position);
            beam.position.y += 1.5;
            beam.rotation.x = Math.PI / 2;
            beam.position.add(forward.multiplyScalar(15));
            beam.lookAt(player.position);
            beam.rotateX(Math.PI / 2);
            scene.add(beam);
            setTimeout(() => scene.remove(beam), 200);
        }
        
        function dealDamage(target, damage, aoe) {
            target.hp -= damage;
            stats.combo++;
            stats.comboTimer = 3;
            
            if (target.maxHp > 100) { // Boss
                document.getElementById('boss-bar').style.width = (target.hp / target.maxHp * 100) + '%';
            }
            
            if (target.hp <= 0) {
                scene.remove(target.mesh);
                
                if (target.maxHp > 100) { // Boss killed
                    bosses = bosses.filter(b => b !== target);
                    const zone = target.zone;
                    zone.bossDefeated = true;
                    
                    // Unlock weapon
                    const idx = zones.indexOf(zone);
                    if (idx >= 0 && idx < weapons.length - 1) {
                        weapons[idx + 1].unlocked = true;
                        notify('🗡️ UNLOCKED: ' + weapons[idx + 1].name, 'levelup');
                    }
                    
                    stats.score += 1000;
                    stats.xp += 500;
                    notify('👹 ' + target.name + ' DEFEATED!', 'boss');
                    
                    if (bosses.length === 0) {
                        document.getElementById('boss-hud').classList.remove('visible');
                    }
                } else { // Normal enemy
                    enemies = enemies.filter(e => e !== target);
                    stats.score += 50 * stats.combo;
                    stats.xp += 30;
                    showKillEffect(target.mesh.position);
                    
                    if (gameMode === 'endless' || enemies.length < 15) {
                        setTimeout(() => spawnEnemy(), 2000);
                    }
                }
                
                playSound(100, 0.2, 'sawtooth');
                checkLevelUp();
            }
            
            updateHUD();
        }
        
        function specialAttack() {
            if (stats.energy < 40) return;
            stats.energy -= 40;
            
            const targets = [...enemies, ...bosses];
            targets.forEach(t => {
                if (t.hp <= 0) return;
                if (player.position.distanceTo(t.mesh.position) < 12) {
                    dealDamage(t, 60, true);
                }
            });
            
            notify('⚡ SPECIAL ATTACK!', 'levelup');
            playSound(100, 0.3, 'sawtooth');
            updateHUD();
        }
        
        function switchWeapon() {
            let next = currentWeapon;
            do {
                next = (next + 1) % weapons.length;
            } while (!weapons[next].unlocked && next !== 0 && next !== currentWeapon);
            
            if (weapons[next].unlocked || next === 0) {
                currentWeapon = next;
                document.getElementById('weapon-icon').textContent = weapons[currentWeapon].icon;
                document.getElementById('weapon-name').textContent = weapons[currentWeapon].name;
                notify('🔄 ' + weapons[currentWeapon].name, 'pickup');
                playSound(300, 0.1, 'sine');
            }
        }
        
        function jump() {
            if (playerOnGround) {
                playerVel.y = 14;
                playerOnGround = false;
                playSound(200, 0.05, 'sine');
            }
        }
        
        function checkLevelUp() {
            const need = stats.level * 150;
            if (stats.xp >= need) {
                stats.xp -= need;
                stats.level++;
                stats.maxHealth += 20;
                stats.health = stats.maxHealth;
                stats.maxEnergy += 10;
                stats.energy = stats.maxEnergy;
                notify('🎉 LEVEL ' + stats.level + '!', 'levelup');
                playSound(523, 0.2, 'sine');
            }
        }
        
        function notify(text, type = 'pickup') {
            const n = document.createElement('div');
            n.className = 'notification ' + type;
            n.textContent = text;
            document.getElementById('notifications').appendChild(n);
            setTimeout(() => n.remove(), 2500);
        }
        
        function showKillEffect(pos) {
            const screenPos = pos.clone().project(camera);
            const x = (screenPos.x + 1) / 2 * window.innerWidth;
            const y = (-screenPos.y + 1) / 2 * window.innerHeight;
            
            const e = document.createElement('div');
            e.className = 'kill-effect';
            e.textContent = '+' + (50 * stats.combo);
            e.style.left = x + 'px';
            e.style.top = y + 'px';
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 1000);
        }
        
        function updateHUD() {
            document.getElementById('health-bar').style.width = (stats.health / stats.maxHealth * 100) + '%';
            document.getElementById('health-value').textContent = Math.floor(stats.health);
            document.getElementById('energy-bar').style.width = (stats.energy / stats.maxEnergy * 100) + '%';
            document.getElementById('energy-value').textContent = Math.floor(stats.energy);
            document.getElementById('xp-bar').style.width = (stats.xp / (stats.level * 150) * 100) + '%';
            document.getElementById('level-value').textContent = 'LV ' + stats.level;
            document.getElementById('score').textContent = stats.score;
            document.getElementById('combo').textContent = stats.combo > 1 ? stats.combo + 'x COMBO' : '';
        }
        
        function playSound(freq, dur, type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ==================== GAME LOOP ====================
        
        let lastZone = null;
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            
            if (gameState === 'playing') {
                // Movement
                const speed = 18;
                let mx = 0, mz = 0;
                
                if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
                if (keys['Space']) jump();
                
                if (isMobile) { mx = joystickX; mz = joystickY; }
                
                player.position.x += mx * speed * delta;
                player.position.z += mz * speed * delta;
                
                // Gravity
                playerVel.y -= 35 * delta;
                player.position.y += playerVel.y * delta;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVel.y = 0;
                    playerOnGround = true;
                }
                
                // Rotation
                if (mx !== 0 || mz !== 0) {
                    player.rotation.y = Math.atan2(mx, mz);
                }
                
                // Camera
                const camTarget = new THREE.Vector3(player.position.x, player.position.y + 10, player.position.z + 16);
                camera.position.lerp(camTarget, 4 * delta);
                camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
                
                // Cooldowns
                if (attackCooldown > 0) attackCooldown -= delta;
                if (stats.comboTimer > 0) {
                    stats.comboTimer -= delta;
                    if (stats.comboTimer <= 0) stats.combo = 0;
                }
                
                // Regen
                stats.energy = Math.min(stats.maxEnergy, stats.energy + 8 * delta);
                stats.health = Math.min(stats.maxHealth, stats.health + 0.5 * delta);
                
                // Zones
                let inZone = null;
                zones.forEach(z => {
                    const dist = Math.sqrt(Math.pow(player.position.x - z.x, 2) + Math.pow(player.position.z - z.z, 2));
                    if (dist < z.size) inZone = z;
                    
                    // Spawn boss when entering zone
                    if (dist < z.size && !z.bossSpawned && !z.bossDefeated && gameMode === 'normal') {
                        z.bossSpawned = true;
                        setTimeout(() => spawnBoss(z), 2000);
                    }
                    
                    // Animate
                    z.mesh.children.forEach(c => {
                        if (c.userData.offset !== undefined) {
                            c.position.y = 4 + Math.sin(time * c.userData.speed + c.userData.offset) * 1.5;
                            c.rotation.y = time * 0.5;
                            c.rotation.x = time * 0.3;
                        }
                    });
                });
                
                if (inZone && inZone !== lastZone) {
                    document.getElementById('zone-name').textContent = inZone.name;
                    document.getElementById('zone-name').style.color = '#' + inZone.color.toString(16).padStart(6, '0');
                    document.getElementById('zone-desc').textContent = inZone.desc;
                    document.getElementById('zone-banner').classList.add('visible');
                    setTimeout(() => document.getElementById('zone-banner').classList.remove('visible'), 2000);
                    lastZone = inZone;
                }
                
                // Enemies
                enemies.forEach(e => {
                    if (e.hp <= 0) return;
                    
                    // Move toward player
                    const toPlayer = player.position.clone().sub(e.mesh.position);
                    const dist = toPlayer.length();
                    
                    if (dist < 50 && dist > 2) {
                        toPlayer.normalize();
                        e.mesh.position.add(toPlayer.multiplyScalar(e.speed * delta));
                    } else if (dist <= 2 && e.attackCooldown <= 0) {
                        // Attack player
                        stats.health -= e.damage;
                        e.attackCooldown = 1;
                        document.getElementById('damage-flash').classList.add('visible');
                        setTimeout(() => document.getElementById('damage-flash').classList.remove('visible'), 100);
                        playSound(80, 0.1, 'sawtooth');
                        
                        if (stats.health <= 0) {
                            stats.health = stats.maxHealth;
                            player.position.set(0, 0, 0);
                            stats.score = Math.max(0, stats.score - 100);
                            notify('☠️ RESPAWNED', 'damage');
                        }
                    }
                    
                    e.attackCooldown -= delta;
                    e.mesh.rotation.y = time * 2;
                    e.mesh.children[0].rotation.x = time * 1.5;
                });
                
                // Bosses
                bosses.forEach(b => {
                    if (b.hp <= 0) return;
                    
                    b.mesh.rotation.y = time * 0.5;
                    b.mesh.children[0].rotation.x = Math.sin(time) * 0.2;
                    b.mesh.children[0].rotation.z = Math.cos(time) * 0.2;
                    
                    // Boss attacks
                    const dist = player.position.distanceTo(b.mesh.position);
                    if (dist < 15 && b.attackCooldown <= 0) {
                        stats.health -= 25;
                        b.attackCooldown = 2;
                        document.getElementById('damage-flash').classList.add('visible');
                        setTimeout(() => document.getElementById('damage-flash').classList.remove('visible'), 150);
                        playSound(60, 0.2, 'sawtooth');
                        notify('💥 -25 HP', 'damage');
                        
                        if (stats.health <= 0) {
                            stats.health = stats.maxHealth;
                            player.position.set(0, 0, 0);
                            notify('☠️ RESPAWNED', 'damage');
                        }
                    }
                    b.attackCooldown -= delta;
                });
                
                // Projectiles
                projectiles.forEach((p, i) => {
                    p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed * delta));
                    p.life -= delta;
                    
                    // Check hits
                    [...enemies, ...bosses].forEach(t => {
                        if (t.hp <= 0) return;
                        if (p.mesh.position.distanceTo(t.mesh.position) < (t.size || 4) + 0.5) {
                            dealDamage(t, p.damage, false);
                            p.life = 0;
                        }
                    });
                    
                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                });
                
                // Collectibles
                collectibles.forEach(c => {
                    if (c.collected) return;
                    c.mesh.rotation.y = time * 2;
                    c.mesh.position.y = 1.5 + Math.sin(time * 3 + c.mesh.position.x) * 0.3;
                    
                    if (player.position.distanceTo(c.mesh.position) < 2) {
                        c.collected = true;
                        scene.remove(c.mesh);
                        
                        if (c.type === 'coin') {
                            stats.score += 10;
                            stats.xp += 5;
                            playSound(880, 0.1, 'sine');
                        } else {
                            stats.health = Math.min(stats.maxHealth, stats.health + 40);
                            stats.energy = Math.min(stats.maxEnergy, stats.energy + 40);
                            notify('+40 HP & ENERGY', 'pickup');
                            playSound(660, 0.15, 'sine');
                        }
                        checkLevelUp();
                    }
                });
                
                updateHUD();
            }
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
